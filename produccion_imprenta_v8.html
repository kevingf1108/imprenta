        function calcRemainingMin(o) {
            const t = calcT(o, cfg);
            if (!t.total || o.etapa === 'listo') return 0;
            if (o.etapa === 'empaque') {
                return t.pasos.filter(p => p.fase === 'emp').reduce((s, p) => s + p.min, 0) || 30;
            }
            if (isAcabEtapa(o.etapa)) {
                const acabFlow = getAcabFlow(o);
                const ci = acabFlow.indexOf(o.etapa);
                const remIds = new Set((ci >= 0 ? acabFlow.slice(ci) : acabFlow).map(s => s.replace('acab_', '')));
                const acabMin = t.pasos.filter(p => p.fase === 'acab' && remIds.has(p.id)).reduce((s, p) => s + p.min, 0);
                const empMin = t.pasos.filter(p => p.fase === 'emp').reduce((s, p) => s + p.min, 0);
                return acabMin + empMin;
            }
            return t.pasos.filter(p => p.fase === 'imp').reduce((s, p) => s + p.min, 0) || t.paralelo;
        }
        function calcTotalRemaining(o) {
            const t = calcT(o, cfg);
            if (!t.total || o.etapa === 'listo') return 0;
            const impMin = t.pasos.filter(p => p.fase === 'imp').reduce((s, p) => s + p.min, 0);
            const acabMin = t.pasos.filter(p => p.fase === 'acab').reduce((s, p) => s + p.min, 0);
            const empMin = t.pasos.filter(p => p.fase === 'emp').reduce((s, p) => s + p.min, 0);
            if (o.etapa === 'empaque') return empMin || 30;
            if (isAcabEtapa(o.etapa)) {
                const acabFlow = getAcabFlow(o);
                const ci = acabFlow.indexOf(o.etapa);
                const remIds = new Set((ci >= 0 ? acabFlow.slice(ci) : acabFlow).map(s => s.replace('acab_', '')));
                return t.pasos.filter(p => p.fase === 'acab' && remIds.has(p.id)).reduce((s, p) => s + p.min, 0) + empMin;
            }
            return impMin + acabMin + empMin;
        }

        // ETA de una orden — usa el mismo scheduler del Gantt (scheduleMachines), así que respeta
        // máquinas en paralelo (varias impresoras a la vez) y el orden real de prioridad (prioSort),
        // en vez de sumar la cola completa como si todo fuera una sola fila.
        // finishMin: mapa precalculado por scheduleMachines(orders, cfg) — pásalo cuando ya lo tengas
        // calculado (ej. una vez por render de tablero) para no recalcular el scheduler por cada tarjeta.
        function calcETA(o, finishMin) {
            const bf = cfg.bufferFactor || 1.0;
            const mins = (finishMin && finishMin[o.id] != null) ? finishMin[o.id] : scheduleMachines(orders, cfg).finishMin[o.id];
            return addDias(new Date(), (mins ?? calcTotalRemaining(o)) * bf, cfg.horasDia);
        }

        // ═══════════════════════════════════════════════════
        //  AUTO-CALIBRACIÓN
        // ═══════════════════════════════════════════════════
        // Mapa: etapa (+ filter opcional) → qué campo de cfg.maq actualizar y cómo calcular
        // la velocidad real. "filter" separa muestras que comparten etapa pero necesitan su
        // propia constante (ej. impresión B&N vs color, o pegado cerca de 150 vs 500 páginas).
        const PAGINAS_CORTE = 325; // punto medio entre 150 y 500 — decide a qué cubeta va cada muestra
        const CALIB_MAP = [
            { etapa: 'acab_ci', key: 'corteInicial', speed: r => r.hojas > 0 && r.mins > 0 ? (r.hojas / r.mins) * 4 : null },
            { etapa: 'acab_es', key: 'espiralado', speed: r => r.cantidad > 0 && r.mins > 0 ? r.cantidad / r.mins : null },
            { etapa: 'acab_en', key: 'engrapadora', speed: r => r.cantidad > 0 && r.mins > 0 ? r.cantidad / r.mins : null },
            { etapa: 'acab_ms', key: 'mesa_trabajo', speed: r => r.cantidad > 0 && r.mins > 0 ? r.cantidad / r.mins : null },
            { etapa: 'acab_cc', key: 'corte_carton', speed: r => r.cantidad > 0 && r.mins > 0 ? r.cantidad / r.mins : null },
            { etapa: 'acab_pp', key: 'ponchadora', speed: r => r.cantidad > 0 && r.mins > 0 ? r.cantidad / r.mins : null },
            // Impresión — B&N y color no comparten velocidad, y color además cambia con el papel
            { etapa: 'impresion', key: 'byn_fast', filter: r => r.tipoInteriores === 'byn', speed: r => r.hojas > 0 && r.mins > 0 ? r.hojas / r.mins : null },
            { etapa: 'impresion', key: 'color_normal', filter: r => r.tipoInteriores === 'color' && r.gramaje !== 'grueso', speed: r => r.hojas > 0 && r.mins > 0 ? r.hojas / r.mins : null },
            { etapa: 'impresion', key: 'color_grueso', filter: r => r.tipoInteriores === 'color' && r.gramaje === 'grueso', speed: r => r.hojas > 0 && r.mins > 0 ? r.hojas / r.mins : null },
            // Plastificado — se descuenta el setup fijo para quedarse con la velocidad real de la máquina
            { etapa: 'acab_pl', key: 'plast_vel', speed: r => { const m = r.mins - (cfg.setup.plastificado || 0); return (r.hojas > 0 && m > 0) ? (r.hojas * (cfg.maq.plast_hoja || 0.475)) / m : null; } },
            // Pegado y Corte Final — se interpolan entre 150 y 500 páginas; cada muestra califica
            // a la constante más cercana según cuántas páginas tenía el libro.
            { etapa: 'acab_pg', key: 'pegado_150', filter: r => r.paginas > 0 && r.paginas <= PAGINAS_CORTE, speed: r => { const m = r.mins - (cfg.setup.pegado || 0); return (r.cantidad > 0 && m > 0) ? r.cantidad / m : null; } },
            { etapa: 'acab_pg', key: 'pegado_500', filter: r => r.paginas > PAGINAS_CORTE, speed: r => { const m = r.mins - (cfg.setup.pegado || 0); return (r.cantidad > 0 && m > 0) ? r.cantidad / m : null; } },
            { etapa: 'acab_cf', key: 'cf_150', filter: r => r.paginas > 0 && r.paginas <= PAGINAS_CORTE, speed: r => { const m = r.mins - (cfg.setup.corteFinal || 0); return (r.cantidad > 0 && m > 0) ? r.cantidad / m : null; } },
            { etapa: 'acab_cf', key: 'cf_500', filter: r => r.paginas > PAGINAS_CORTE, speed: r => { const m = r.mins - (cfg.setup.corteFinal || 0); return (r.cantidad > 0 && m > 0) ? r.cantidad / m : null; } },
        ];

        function autoCalibrate() {
            const minF = cfg.calibRangeMin != null ? cfg.calibRangeMin : 0.5;
            const maxF = cfg.calibRangeMax != null ? cfg.calibRangeMax : 2.0;
            let changed = false;
            CALIB_MAP.forEach(({ etapa, key, filter, speed }) => {
                let samples = statsHistory.filter(r => r.etapa === etapa);
                if (filter) samples = samples.filter(filter);
                const speeds = samples.map(speed).filter(v => v !== null && v > 0);
                if (speeds.length < 3) return;
                speeds.sort((a, b) => a - b);
                const median = speeds[Math.floor(speeds.length / 2)];
                const filtered = speeds.filter(v => v >= median * minF && v <= median * maxF);
                if (!filtered.length) return;
                const avg = filtered.reduce((s, v) => s + v, 0) / filtered.length;
                const rounded = Math.round(avg * 10) / 10;
                if (Math.abs(rounded - cfg.maq[key]) > 0.05) { cfg.maq[key] = rounded; changed = true; }
            });
            if (changed) saveBoard();
        }

        // ═══════════════════════════════════════════════════
        //  STATS
        // ═══════════════════════════════════════════════════
        // ═══════════════════════════════════════════════════
        //  MÉTRICAS DE CUMPLIMIENTO
        // ═══════════════════════════════════════════════════
        function calcOrderMetrics() {
            const result = [];
            historial.forEach(h => {
                const recs = statsHistory.filter(r => r.ordId === h.id && r.mins > 0);
                const impRec = [...recs].reverse().find(r => r.etapa === 'impresion');
                const empRec = [...recs].reverse().find(r => r.etapa === 'empaque');
                const firstStart = recs.length ? Math.min(...recs.map(r => r.ts - r.mins * 60000)) : null;
                const impEnd = impRec?.ts || null;
                const empEnd = empRec?.ts || null;
                const completedTs = empEnd || h.ts;
                const totalMin = (firstStart && completedTs && completedTs > firstStart) ? Math.round((completedTs - firstStart) / 60000) : null;
                const impMin = impRec?.mins || null;
                const impToEmpMin = (impEnd && empEnd && empEnd > impEnd) ? Math.round((empEnd - impEnd) / 60000) : null;
                const impStart = impRec ? (impRec.ts - impRec.mins * 60000) : null;
                const createdTs = h.fechaCreacion ? new Date(h.fechaCreacion + 'T00:00:00').getTime() : null;
                const queueMin = (createdTs && impStart && impStart > createdTs) ? Math.round((impStart - createdTs) / 60000) : null;
                const fechaLimite = h.fechaLimite || null;
                let onTime = null, diasDiff = null;
                if (fechaLimite && completedTs) {
                    diasDiff = Math.round((completedTs - new Date(fechaLimite + 'T23:59:59').getTime()) / 86400000);
                    onTime = diasDiff <= 0;
                }
                // Qué tan acertado fue el motor: compara cuándo dijo que iba a estar lista
                // (etaPredicha, congelada la primera vez que la app la calculó) contra cuándo
                // se entregó de verdad. Positivo = se tardó más de lo predicho.
                const etaPredicha = h.etaPredicha || null;
                let motorErrorDias = null, motorOnTime = null;
                if (etaPredicha && completedTs) {
                    motorErrorDias = Math.round((completedTs - new Date(etaPredicha + 'T23:59:59').getTime()) / 86400000);
                    motorOnTime = motorErrorDias <= 0;
                }
                result.push({ id: h.id, titulo: h.titulo, cliente: h.cliente || '', cantidad: h.cantidad || 0, fechaLimite, completedTs, totalMin, impMin, impToEmpMin, queueMin, onTime, diasDiff, etaPredicha, motorErrorDias, motorOnTime });
            });
            return result.sort((a, b) => (b.completedTs || 0) - (a.completedTs || 0));
        }

        function scanLogHTML() {

        <div style="font-size:13px;color:#475569;margin-top:8px">Cuando se escanee un código que no existe en el tablero, aparecerá aquí con la razón.</div>
      </div>`;

                <button onclick="buscarEnSheets('${e(r.codigo || r.raw || '')}')" style="background:none;border:none;color:#60a5fa;cursor:pointer;font-size:13px" title="Buscar directo en Google Sheets (todas las hojas)">🔎</button>
                <button onclick="scanLog=scanLog.filter(x=>x.ts!==${r.ts});saveS();setV('scan_log')" style="background:none;border:none;color:#475569;cursor:pointer;font-size:13px" title="Borrar">✕</button>
              </td>

      </div>`;
        }

        // Reintenta un escaneo que antes no encontró la orden (ej. porque el sync
        // todavía no la había traído) contra el estado ACTUAL del tablero.
        function retryScanLogEntry(ts) {
            const entry = scanLog.find(x => x.ts === Number(ts));
            if (!entry) return;
            scanLog = scanLog.filter(x => x.ts !== Number(ts));
            const ok = handleScan(entry.raw);
            if (ok) showToast('✅ Reintento OK: ' + (entry.codigo || entry.raw));
            saveS(); setV('scan_log');
        }
        // Reintenta TODOS los escaneos no encontrados de una — silencioso por cada uno,
        // con un solo resumen al final en vez de un toast por cada intento.
        function retryAllScanLog() {
            if (!scanLog.length) return;
            const entries = [...scanLog];
            scanLog = [];
            let okCount = 0;
            entries.forEach(entry => { if (handleScan(entry.raw, true)) okCount++; });
            saveS();
            showToast(`🔁 Reintentados ${entries.length}: ${okCount} resueltos, ${entries.length - okCount} siguen sin encontrarse`, 6000);
            setV('scan_log');
        }

        // Busca un # item directo en TODAS las hojas de Google Sheets (no solo las 3 que
        // se sincronizan al tablero) — para saber si un escaneo "no encontrado" es porque
        // el sync todavía no lo trajo, o porque de verdad no existe en ningún lado.
        async function buscarEnSheets(codigo) {
            if (!cfg.scriptUrl) { showToast('⚠️ Configura la URL del script primero'); return; }
            const digits = String(codigo || '').replace(/\D/g, '').slice(0, 6);
            if (!digits) { showToast('⚠️ No hay número de item para buscar'); return; }
            showToast('🔎 Buscando ' + digits + ' en Google Sheets...', 3000);
            try {
                const r = await fetch(scriptURL('action=buscaritem&item=' + encodeURIComponent(digits)));
                const data = await r.json();
                if (!data.ok) { showToast('❌ ' + (data.error || 'Error al buscar'), 6000); return; }
                if (!data.found || !data.found.length) {
                    showToast('🔎 ' + digits + ': no se encontró en NINGUNA hoja de Sheets', 7000);
                    return;
                }
                const resumen = data.found.map(f =>
                    `${f.hoja} (fila ${f.fila}${f.etapa ? ', etapa=' + f.etapa : ''}${f.listo ? ', listo=' + f.listo : ''})`
                ).join(' · ');
                showToast('🔎 ' + digits + ' — SÍ existe en: ' + resumen, 10000);
            } catch (err) {
                showToast('❌ Error al buscar: ' + err.message, 6000);
            }
        }

        function deleteStatRecord(ts, ordId) {
            const i = statsHistory.findIndex(r => r.ts === Number(ts) && r.ordId === ordId);
            if (i >= 0) { statsHistory.splice(i, 1); saveS(); setV('stats'); }
        }

        function limpiarOutliersStats() {
            const ETAPA_UNIT = {
                'impresion': r => r.hojas > 0 && r.mins > 0 ? r.hojas / r.mins : null,
                'acab_pl':   r => r.hojas > 0 && r.mins > 0 ? r.hojas / r.mins : null,
                'acab_ci':   r => r.hojas > 0 && r.mins > 0 ? r.hojas / r.mins : null,
            };
            const defMetric = r => r.cantidad > 0 && r.mins > 0 ? r.cantidad / r.mins : null;
            // Agrupar por etapa y calcular mediana por grupo
            const groups = {};
            statsHistory.filter(r => r.mins > 0).forEach(r => {
                const key = r.etapa;
                if (!groups[key]) groups[key] = [];
                const metric = (ETAPA_UNIT[r.etapa] || defMetric)(r);
                if (metric !== null) groups[key].push({ r, metric });
            });
            const outlierTs = new Set();
            Object.values(groups).forEach(items => {
                if (items.length < 3) return;
                const sorted = [...items].sort((a, b) => a.metric - b.metric);
                const med = sorted[Math.floor(sorted.length / 2)].metric;
                items.forEach(({ r, metric }) => {
                    // Borrar si es <15% o >500% de la mediana (outlier claro)
                    if (metric < med * 0.15 || metric > med * 5) outlierTs.add(r.ts + '|' + r.ordId);
                });
            });
            // Siempre borrar registros con menos de 3 min (escaneo accidental)
            statsHistory.filter(r => r.mins > 0 && r.mins < 3).forEach(r => outlierTs.add(r.ts + '|' + r.ordId));
            const before = statsHistory.length;
            statsHistory = statsHistory.filter(r => !outlierTs.has(r.ts + '|' + r.ordId));
            const n = before - statsHistory.length;
            saveS(); setV('stats');
            showToast(n > 0 ? `🧹 ${n} registros outlier eliminados` : '✅ Sin outliers detectados');
        }

            const makeBlock = (label, items, etapa, headerExtra = '') => {

                const speeds = items.map(unitCfg.metric).filter(v => v !== null);
                const avg = speeds.length ? speeds.reduce((s, v) => s + v, 0) / speeds.length : 0;

          </tr>`;
                }).join('');
                return `<div style="background:#1e293b;border-radius:12px;padding:16px;margin-bottom:14px">

              <span style="background:#0a2040;border:1px solid #1d4ed8;padding:3px 10px;border-radius:6px;font-size:12px;color:#60a5fa">${items.length} registros</span>

          <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
            <tr style="color:#475569;font-size:11px;border-bottom:1px solid #334155">

            if (maq === 'oce6320') return { key: 'oce6320', label: 'OCE 6320', color: '#94a3b8', order: 1 };
            if (maq === 'titan') return { key: 'titan', label: 'Titan 6180', color: '#64748b', order: 2 };
            if (maq === 'c1352') return { key: 'c1352', label: 'Color 1352', color: '#fb923c', order: 3 };
            if (maq === 'c1351') return { key: 'c1351', label: 'Color 1351', color: '#f97316', order: 4 };
            if (maq === 'c1353') return { key: 'c1353', label: 'Color 1353', color: '#fbbf24', order: 5 };
            if (maq === 'c10010') return { key: 'c10010', label: 'Color 10010', color: '#ea580c', order: 6 };
            if (o.tipoInteriores === 'byn') return { key: 'byn', label: 'OCE / Titan', color: '#94a3b8', order: 0 };
            return { key: 'color', label: '1352 / 1351 / 1353 / 10010', color: '#fb923c', order: 7 };

        function impSecciones(list) {
            const map = {};

                const papel = o.gramaje === 'grueso' ? 'Grueso >200g' : 'Normal ≤150g';
                const tam = o.tamano || 'tabloide';
                const key = `${String(maq.order).padStart(2, '0')}|${papel}|${tam}`;
                if (!map[key]) map[key] = { maq, papel, tam, items: [], key };
                map[key].items.push(o);

            return Object.values(map).sort((a, b) => a.key.localeCompare(b.key));
        }
        function boardHTML() {
            // Build visible columns: impresion + acab steps that have orders + empaque + listo
            const etapas = allEtapas(orders);

            const finishMin = scheduleMachines(orders, cfg).finishMin;

            const allTotal = orders.filter(o => o.etapa === et.id && !o._merged);

            let body;
            const allSorted = [...all].sort(prioSort);
            if (et.id === 'impresion' && allSorted.length > 0) {
                const secs = impSecciones(allSorted);
                let globalIdx = 0;
                body = secs.map(sec => {
                    const tamLabel = sec.tam === 'carta' ? 'Carta' : sec.tam === 'oficio' ? 'Oficio' : 'Tabloide';

      ${secCards}`;
                }).join('');
            } else {

    ${(() => {

        // ═══════════════════════════════════════════════════

        function ganttHTML() {
            const { blocks, colorMap } = scheduleMachines(orders, cfg);
            if (!blocks.length) return `<div style="color:#334155;text-align:center;padding:60px;font-size:20px">Sin órdenes activas</div>`;
            const pxM = ganttZoom / 60;
            const hpd = cfg.horasDia || 10;          // horas laborales por día (default 10 = 8am-6pm)
            const startH = cfg.startHour || 8;       // hora de inicio de jornada
            const endH = startH + hpd;               // hora de fin (ej. 18)
            const mpd = hpd * 60;                    // minutos laborales por día
            // Posición "AHORA" en minutos laborales desde inicio de jornada hoy
            const nowDate = new Date();
            const todayStart = new Date(nowDate); todayStart.setHours(startH, 0, 0, 0);
            const nowWmin = Math.max(0, Math.min((nowDate - todayStart) / 60000, mpd));
            const nowPx = nowWmin * pxM;
            const maxEnd = Math.max(...blocks.map(b => b.end), mpd) + 120;
            const totalW = Math.round(maxEnd * pxM) + 80;
            // Marcadores de tiempo: cuadrícula por jornada laboral
            const numDays = Math.ceil(maxEnd / mpd) + 1;
            const markers = [];
            for (let d = 0; d < numDays; d++) {
                const dayWmS = d * mpd;
                const dayDate = new Date(todayStart); dayDate.setDate(dayDate.getDate() + d);
                const dayLbl = dayDate.toLocaleDateString('es', { weekday: 'short', day: '2-digit', month: 'short' });
                // Línea y etiqueta de inicio de jornada
                markers.push(`<div style="position:absolute;left:${dayWmS * pxM}px;top:0;bottom:0;border-left:2px solid #3b4f6b;pointer-events:none"><div style="position:absolute;top:0;left:3px;font-size:11px;color:#60a5fa;white-space:nowrap;font-weight:700;background:#060d1a;padding:0 3px">${dayLbl} ${String(startH).padStart(2, '0')}:00</div></div>`);
                // Marcadores horarios dentro del día
                for (let h = 1; h <= hpd; h++) {
                    const wm = dayWmS + h * 60;
                    if (wm > maxEnd + 60) break;
                    const hh = startH + h;
                    const isEndOfDay = hh === endH;
                    markers.push(`<div style="position:absolute;left:${wm * pxM}px;top:0;bottom:0;border-left:1px solid ${isEndOfDay ? '#3b4f6b' : '#1e293b'};pointer-events:none"><div style="position:absolute;top:0;left:2px;font-size:10px;color:${isEndOfDay ? '#60a5fa' : '#334155'};white-space:nowrap;background:#060d1a;padding:0 1px">${String(hh).padStart(2, '0')}:00${isEndOfDay ? ' ◀fin' : ''}</div></div>`);
                }
            }
            const timeMarkers = markers.join('');
            const sorted = orders.filter(o => o.etapa !== 'listo' && !o._merged).sort(prioSort);
            // Leyenda con nombre completo de la orden
            const legend = sorted.map(o => `<div style="display:flex;align-items:center;gap:5px;white-space:nowrap"><div style="width:12px;height:12px;border-radius:2px;background:${colorMap[o.id] || '#666'};flex-shrink:0"></div><span style="font-size:11px;color:#94a3b8"><b style="color:#f1f5f9">${e(o.id)}</b> ${e(o.titulo.substring(0, 28))}${o.titulo.length > 28 ? '…' : ''}</span></div>`).join('');
            const usedIds = new Set(blocks.map(b => b.machId));
            const usedM = MAQUINAS.filter(m => usedIds.has(m.id));
            let lastG = '';
            const rows = usedM.map(mach => {
                const mb = blocks.filter(b => b.machId === mach.id).sort((a, b) => a.start - b.start);
                const bars = mb.map((b, bi) => {
                    // Posición = minutos laborales directamente (0 = inicio de jornada)
                    const x = b.start * pxM, w = Math.max(b.dur * pxM, 6);
                    const brd = isOD(b.fechaLimite) ? 'border:2px solid #ef4444' : isSoon(b.fechaLimite) ? 'border:2px solid #f59e0b' : b._isMuestra ? 'border:2px dashed #94a3b8' : '';
                    const muestraStyle = b._isMuestra ? 'opacity:0.82;' : '';
                    const tipoBadge = b.tipo === 'muestra' ? '🔬' : b.tipo === 'int_sub' ? 'I·' : b.tipo === 'port_sub' ? 'P·' : b.tipo === 'union_result' ? '🔗' : '';
                    const buddyBadge = b.buddyGroup ? '🔗' : '';
                    const shortId = e(b.ordId);
                    const shortTit = b.titulo.length > 20 ? b.titulo.substring(0, 18) + '…' : b.titulo;
                    const buddyTip = b.buddyGroup ? `&#10;🔗 Grupo: ${b.buddyGroup} (espera piezas del mismo trabajo)` : '';
                    // Primera barra y es muy angosta → etiqueta a la izquierda
                    if (bi === 0 && w <= 38) {
                        const leftLabel = `<div style="position:absolute;left:${x - 4}px;top:50%;transform:translate(-100%,-50%);font-size:10px;color:#e2e8f0;white-space:nowrap;pointer-events:none;font-weight:700;background:#0f172a;padding:0 3px;border-radius:3px">${tipoBadge}${buddyBadge}${shortId}</div>`;
                        return leftLabel + `<div class="gantt-bar" style="left:${x}px;width:${w}px;background:${b.color};${brd};${muestraStyle}overflow:hidden;text-overflow:clip" title="${e(b.ordId)}: ${e(b.titulo)}&#10;${e(b.stepNom)} · ${mStr(b.dur)}${b.urgente ? '&#10;⚡ URGENTE' : ''}${b._isMuestra ? '&#10;🔬 MUESTRA' : ''}${buddyTip}"></div>`;
                    }
                    const barLabel = w > 90 ? `${tipoBadge}${buddyBadge}${shortId} ${e(shortTit)}` : w > 38 ? `${tipoBadge}${buddyBadge}${shortId}` : tipoBadge || buddyBadge;
                    return `<div class="gantt-bar" style="left:${x}px;width:${w}px;background:${b.color};${brd};${muestraStyle}overflow:hidden;text-overflow:clip" title="${e(b.ordId)}: ${e(b.titulo)}&#10;${e(b.stepNom)} · ${mStr(b.dur)}${b.urgente ? '&#10;⚡ URGENTE' : ''}${b._isMuestra ? '&#10;🔬 MUESTRA' : ''}${buddyTip}">${barLabel}</div>`;
                }).join('');
                const gh = mach.grupo !== lastG ? `<div style="display:flex;border-bottom:1px solid #334155;background:#060d1a"><div style="width:160px;flex-shrink:0;padding:3px 10px;font-size:10px;color:#475569;font-weight:700;border-right:1px solid #1e293b">${e(mach.grupo)}</div><div style="flex:1"></div></div>` : '';
                lastG = mach.grupo;
                return gh + `<div class="gantt-row"><div class="gantt-label">${e(mach.label)}</div><div class="gantt-track">${bars}</div></div>`;
            }).join('');
            return `<div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:8px">
    <div style="background:#0a0f1e;border-radius:12px;flex:1;overflow:auto">
      <div style="display:flex"><div style="width:160px;flex-shrink:0;position:sticky;left:0;z-index:20;background:#060d1a;border-bottom:1px solid #334155;border-right:1px solid #1e293b"><div style="padding:6px 10px;font-size:11px;color:#64748b;font-weight:700">MÁQUINA</div></div>
        <div style="position:relative;height:30px;flex:1;min-width:${totalW}px;border-bottom:1px solid #334155;background:#060d1a">${timeMarkers}</div>
      </div>
      <div style="position:relative">${rows}
        <div style="position:absolute;top:0;left:${160 + nowPx}px;bottom:0;width:2px;background:#ef4444;z-index:5;pointer-events:none">
          <div style="position:absolute;top:2px;left:4px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;white-space:nowrap">AHORA</div>
        </div>
      </div>
    </div>
    <div style="font-size:10px;color:#475569;text-align:center">🕗 Jornada: ${String(startH).padStart(2, '0')}:00–${String(endH).padStart(2, '0')}:00 · I=Interiores · P=Portada · 🔗=Unido · Cursor sobre barra = detalle</div>
  </div>`;
        }

        function tvKanbanHTML() {
            return `<div style="display:flex;gap:8px;flex:1;overflow:hidden">
    ${[ETAPAS[0], ...ACAB_STEPS, ...ETAPAS.slice(1)].filter(et => et.id !== 'listo').map(et => {
                const cols = orders.filter(o => o.etapa === et.id && !o._merged); return `

        ${cols.length === 0 ? `<div style="color:#334155;font-size:18px;text-align:center;padding:20px 0">Libre ✓</div>` :

            ${cols.slice(0, 6).map(o => {

              <div style="background:#1e293b;border-radius:9px;padding:10px 12px;border-left:3px solid ${o.urgente ? '#ef4444' : tipo === 'int_sub' ? '#818cf8' : tipo === 'port_sub' ? '#c084fc' : tipo === 'union_result' ? '#4ade80' : et.color}">

    <div class="tv-col" style="max-width:190px;border-top:3px solid #4ade80">
      <div style="font-size:20px;font-weight:800;color:#4ade80;margin-bottom:8px">✅ Listos</div>

        <div style="background:#0a2e1a;border-radius:7px;padding:8px 10px;border:1px solid #14532d;margin-bottom:5px">
          <div style="font-size:13px;color:#f1f5f9;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e(o.titulo)}</div>
          <div style="font-size:10px;color:#64748b">${e(o.cliente)}</div>
        </div>`).join('')}
    </div>
  </div>`;
        }

          <div><div style="font-size:12px;color:#64748b;margin-top:10px">Factor buffer entrega (×)</div><input class="inp" type="number" step="0.05" min="1" max="3" value="${cfg.bufferFactor || 1.3}" oninput="cfg.bufferFactor=+this.value;saveBoard()" style="margin-top:3px"><div style="font-size:10px;color:#475569;margin-top:2px">1.3 = 30% extra sobre el tiempo calculado</div></div>
          <div></div>
          <div><div style="font-size:12px;color:#64748b;margin-top:10px">Rango mín. calibración (fracción)</div><input class="inp" type="number" step="0.05" min="0.1" max="1" value="${cfg.calibRangeMin || 0.5}" oninput="cfg.calibRangeMin=+this.value;saveBoard()" style="margin-top:3px"><div style="font-size:10px;color:#475569;margin-top:2px">0.5 = excluir muestras < 50% de la mediana</div></div>
          <div><div style="font-size:12px;color:#64748b;margin-top:10px">Rango máx. calibración (fracción)</div><input class="inp" type="number" step="0.1" min="1" max="5" value="${cfg.calibRangeMax || 2.0}" oninput="cfg.calibRangeMax=+this.value;saveBoard()" style="margin-top:3px"><div style="font-size:10px;color:#475569;margin-top:2px">2.0 = excluir muestras > 200% de la mediana</div></div>
        </div>
      </div>
      ${secs.map(sec => `<div style="background:#0f172a;border-radius:10px;padding:12px;margin-top:12px"><div style="font-size:12px;color:${sec.color};font-weight:700;letter-spacing:.5px;margin-bottom:4px">${sec.title}</div><div class="g2">${sec.items.map(([l, p, s]) => inp(l, p, s)).join('')}</div></div>`).join('')}
      <div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn btn-g" onclick="closeCfg()">Cerrar</button></div>
    </div>
  </div>`;
        }

        // ═══════════════════════════════════════════════════
        //  ACCIONES
        // ═══════════════════════════════════════════════════
        function setV(v) { V = v; render(); }
        function exitTV() { V = 'kanban'; render(); }
        function openNew() { modalId = null; render(); setTimeout(updEst, 50); }
        function openOrd(id) { modalId = id; render(); setTimeout(updEst, 50); }
        function closeModal() { modalId = undefined; render(); }
        function setSeg(name, val) {
            document.getElementById(`f_${name}`).value = val;
            document.querySelectorAll(`[id^="seg_${name}_"]`).forEach(btn => {
                const bv = btn.id.replace(`seg_${name}_`, ''), enc = TIPOS_ENC.find(t => t.id === bv);
                if (bv === val) { btn.classList.add('on'); btn.style.background = enc ? enc.color : '#3b82f6'; btn.style.color = '#0f172a'; btn.style.borderColor = 'transparent'; }
                else { btn.classList.remove('on'); btn.style.background = '#0f172a'; btn.style.color = '#94a3b8'; btn.style.borderColor = '#334155'; }
            }); updEst();
        }
        function saveOrd() {
            const o = getFormOrder(); if (!o.cliente || !o.titulo || !o.cantidad) { alert('Completa los campos obligatorios (*)'); return; }
            if (o._split && modalId === null) { createSplitOrders(o); return; }
            const ord = { ...o, tipo: o._split ? 'normal' : 'normal' };
            if (modalId === null) { orders.push({ ...ord, tipo: 'normal', id: nextId(), etapa: 'impresion', fechaCreacion: new Date().toISOString().split('T')[0] }); }
            else { const idx = orders.findIndex(x => x.id === modalId); if (idx >= 0) orders[idx] = { ...orders[idx], ...ord }; }
            saveBoard(); modalId = undefined; render();
        }
        function delOrd() { if (!confirm('¿Eliminar esta orden?')) return; orders = orders.filter(o => o.id !== modalId); delete etapaMap[modalId]; saveBoard(); modalId = undefined; render(); }
        function mvOrd(id, dir) {
            const idx = orders.findIndex(o => o.id === id); if (idx < 0) return;
            const o = orders[idx];
            const fromEtapa = o.etapa;
            // Flujo natural de esta orden
            const flow = [
                ETAPAS[0],
                ...getAcabFlow(o).map(sid => ACAB_STEPS.find(s => s.id === sid)).filter(Boolean),
                ETAPAS[1],
                ETAPAS[2],
            ];
            let ei = flow.findIndex(et => et && et.id === o.etapa);
            if (ei < 0) {
                // La orden fue movida a un paso fuera de su flujo natural → usar columnas del tablero
                const boardEt = allEtapas(orders);
                const bi = boardEt.findIndex(et => et && et.id === o.etapa);
                if (bi < 0) return;
                const target = boardEt[bi + dir];
                if (!target) return;
                orders[idx] = { ...orders[idx], etapa: target.id };
                etapaMap[id] = target.id;
                logMove(orders[idx], fromEtapa, target.id, 'boton');
                if (target.id === 'listo') { delete etapaMap[id]; clearOrderTimers(id); pushHistorial(orders[idx]); }
                autoGroupFinish(id, target.id);
                callScript(orders[idx], target.id, fromEtapa);
                autoMergeCheck();
                (target.id === 'listo' ? saveS() : saveBoard());
                render(); return;
            }
            const ni = ei + dir;
            if (ni < 0 || ni >= flow.length) return;
            orders[idx] = { ...orders[idx], etapa: flow[ni].id };
            etapaMap[id] = flow[ni].id;
            logMove(orders[idx], fromEtapa, flow[ni].id, 'boton');
            if (flow[ni].id === 'listo') { delete etapaMap[id]; clearOrderTimers(id); pushHistorial(orders[idx]); }
            autoGroupFinish(id, flow[ni].id);
            callScript(orders[idx], flow[ni].id, fromEtapa);
            autoMergeCheck();
            (flow[ni].id === 'listo' ? saveS() : saveBoard());
            render();
        }
        function openCfg() { showCfg = true; render(); }
        function closeCfg() { showCfg = false; render(); }
        function openSync() { showSync = true; render(); }
        function closeSync() { showSync = false; render(); }
        function setAutoSync(v) {
            autoSync = v;
            if (_autoSyncInt) { clearInterval(_autoSyncInt); _autoSyncInt = null; }
            if (autoSync) { runSync(); _autoSyncInt = setInterval(runSync, 5 * 60 * 1000); }
            render();
        }
        function updCfg(el) { const path = el.dataset.cfg, val = +el.value, ks = path.split('.'); let o = cfg; for (let i = 0; i < ks.length - 1; i++)o = o[ks[i]]; o[ks[ks.length - 1]] = val; saveBoard(); }

        // ═══════════════════════════════════════════════════
        //  ESCÁNER DE CÓDIGO DE BARRAS
        //  Los escáneres envían los caracteres muy rápido (<80ms entre teclas) + Enter al final.
        //  El código impreso en cada orden debe ser su ID (ej: ORD-001 o 123-I).
        // ═══════════════════════════════════════════════════
        let _scanBuf = '', _scanTs = 0;

        document.addEventListener('keydown', ev => {
            // Ignorar si el foco está en un input, textarea o modal abierto
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(ev.target.tagName)) return;
            if (modalId !== undefined || showCfg || showSync) return;
            const now = Date.now();
            // Si pasaron más de 150ms desde la última tecla, resetear buffer (escritura manual)
            if (now - _scanTs > 150) _scanBuf = '';
            _scanTs = now;
            if (ev.key === 'Enter') {
                if (_scanBuf.length >= 3) handleScan(_scanBuf.trim());
                _scanBuf = '';
                ev.preventDefault();
            } else if (ev.key.length === 1) {
                _scanBuf += ev.key;
            }
        });

        // Tiempos de inicio por orden: { ordId: timestamp }
        // ── Mapa de prefijos de proceso → etapa interna ─────────────────
        // Orden: de más largo a más corto para evitar ambigüedad (CDC antes que CC; EM antes que E)
        const SCAN_PROC = [
            { pre: 'CDC', etapa: 'acab_cdc', label: 'Cinta Doble Cara' },
            { pre: 'CI', etapa: 'acab_ci', label: 'Corte Inicial' },
            { pre: 'CF', etapa: 'acab_cf', label: 'Corte Final', grupo: true },
            { pre: 'CC', etapa: 'acab_cc', label: 'Corte Cartón' },
            { pre: 'PD', etapa: 'acab_ap', label: 'Armado Portada' },
            { pre: 'MT', etapa: 'acab_ms', label: 'Mesa de Trabajo', grupo: true },
            { pre: 'PP', etapa: 'acab_pp', label: 'Ponchado Port' },
            { pre: 'PI', etapa: 'acab_pi', label: 'Ponchado Int' },
            { pre: 'P', etapa: 'acab_pl', label: 'Plastificado' },
            { pre: 'ES', etapa: 'acab_es', label: 'Espiralado', grupo: true },
            { pre: 'EN', etapa: 'acab_en', label: 'Engrapado', grupo: true },
            { pre: 'E', etapa: 'empaque', label: 'Empaque', grupo: true },
            { pre: 'I', etapa: 'impresion', label: 'Impresión' },
            { pre: 'H', etapa: 'acab_pg', label: 'Hotmelt', grupo: true },
        ];
        // Prefijos especiales: NO avanzan el kanban, solo mandan la última fila de la hoja a Sheets
        const SCAN_LOG_PRE = ['HE', 'DI', 'KE', 'IS', 'AD', 'T'];
        // Prefijos de máquina: F%W, P%W, O%W → mandan a hoja de log de máquinas
        const MAQ_SCAN_PRE = ['F%W', 'P%W', 'O%W'];

        let _scanTimers = {};
        try { _scanTimers = JSON.parse(localStorage.getItem('imp_timers') || '{}'); } catch { }
        // Limpiar timers de órdenes ya en listo al arrancar
        setTimeout(() => { orders.filter(o => o.etapa === 'listo').forEach(o => { Object.keys(_scanTimers).filter(k => k === o.id || k.startsWith(o.id + '_')).forEach(k => delete _scanTimers[k]); }); saveTimers(); }, 1000);
        function saveTimers() { try { localStorage.setItem('imp_timers', JSON.stringify(_scanTimers)); } catch { } }
        function clearOrderTimers(ordId) {
            Object.keys(_scanTimers).filter(k => k === ordId || k.startsWith(ordId + '_')).forEach(k => delete _scanTimers[k]);
            saveTimers();
        }

        // silent=true: para reintentos masivos — no muestra toast/flash por cada uno.
        // Devuelve true si encontró y movió la orden, false si no la encontró.
        function handleScan(raw, silent) {
            const raw2 = raw.trim().toUpperCase();
            // ── 0. Prefijos especiales: solo mandan última fila a Sheets ──
            const logPre = SCAN_LOG_PRE.find(p => raw2.startsWith(p));
            if (logPre) { sendScanToSheets(raw2); return true; }
            // ── 0b. Prefijos de máquina: F%W, P%W, O%W, IM%W → log maquinas ──
            const maqPre = MAQ_SCAN_PRE.find(p => raw2.startsWith(p));
            if (maqPre) { sendMaqScanToSheets(raw2); return true; }
            // ── 1. Parsear sufijo i/p ────────────────────────────────────
            // i = Inicia (llega a este paso, arranca timer)
            // p = Pasa   (terminó este paso, avanza al siguiente)
            const suffix = raw2.slice(-1);
            const isInicio = suffix === 'I';
            const isPaso = suffix === 'P';
            const cuerpo = (isInicio || isPaso) ? raw2.slice(0, -1) : raw2;

            // ── 2. Detectar prefijo de proceso ───────────────────────────
            let proc = null, ordId = cuerpo;
            for (const p of SCAN_PROC) {
                if (cuerpo.startsWith(p.pre)) {
                    proc = p;
                    ordId = cuerpo.slice(p.pre.length);
                    break;
                }
            }

            // ── 2b. Detectar prefijo 'm' de muestra ──────────────────────
            // Formatos: Im283381 → ordId=M283381, IM%W283381 → ordId=M%W283381
            // El escáner puede insertar %W entre M y el número de item
            const mMatch = ordId.match(/^M(%W)?(\d)/);
            const scanMuestra = !!mMatch;
            if (scanMuestra) ordId = ordId.replace(/^M(%W)?/, '');

            // ── 3. Buscar orden(es) ──────────────────────────────────────
            // grupo:true  → 5 dígitos, mueve todo el grupo (pegado y después)
            // grupo:false → 6 dígitos exactos, mueve SOLO esa orden (impresión, CI, plastificado…)
            const esGrupo = proc ? !!proc.grupo : false;
            // Tomar solo los primeros 6 dígitos (ignora %W, sufijos del escáner como 0013, etc.)
            const digits6 = ((ordId.match(/\d+/) || [''])[0] || ordId.replace(/\D/g, '')).slice(0, 6);
            const prefix5 = digits6.slice(0, 5);

            let matches;
            if (esGrupo && prefix5.length >= 5) {
                // Pasos de unión: busca todo el grupo por primeros 5 dígitos
                matches = orders.filter(x => !x._merged && x.etapa !== 'listo' &&
                    (scanMuestra ? !!x._isMuestra : !x._isMuestra) &&
                    ((x.grupoId && x.grupoId.toString().replace(/\D/g, '').startsWith(prefix5)) ||
                        x.id.replace(/\D/g, '').startsWith(prefix5)));
            } else {
                // Pasos individuales: coincidencia por 6 dígitos exactos (id o grupoId)
                matches = orders.filter(x => !x._merged && x.etapa !== 'listo' &&
                    (scanMuestra ? !!x._isMuestra : !x._isMuestra) &&
                    (x.id.replace(/\D/g, '') === digits6 ||
                        (x.grupoId && x.grupoId.toString().replace(/\D/g, '') === digits6)));
                // Si hay varios (INT + PORT del mismo grupo), quedarse solo con los del paso actual
                if (matches.length > 1 && proc) {
                    const enEstePaso = matches.filter(o => o.etapa === proc.etapa);
                    if (enEstePaso.length > 0) matches = enEstePaso;
                }
                // Si aún hay varios (ambos en el mismo paso), tomar solo el primero
                if (matches.length > 1) matches = [matches[0]];
            }


            if (!matches.length) {
                const anyMatch = orders.filter(x => x.id.replace(/\D/g, '') === digits6 || x.grupoId?.toString().replace(/\D/g, '') === digits6);
                // Recuperar órdenes válidas aunque estén en otra etapa o sean muestra/no-muestra
                const recoverable = proc ? anyMatch.filter(x => !x._merged && x.etapa !== 'listo') : [];
                if (!recoverable.length) {
                    const razon = anyMatch.length
                        ? 'Existe pero filtrada: ' + anyMatch.map(x => x.id + ' etapa=' + x.etapa + (x._merged ? ' MERGED' : '') + (x._isMuestra ? ' MUESTRA' : '')).join(', ')
                        : 'No existe en el tablero (digits=' + digits6 + ')';
                    scanLog.unshift({ ts: Date.now(), raw, codigo: ordId, proceso: proc ? proc.label : '—', razon });
                    if (scanLog.length > 200) scanLog = scanLog.slice(0, 200);
                    saveS();
                    if (!silent) showToast('❌ No encontrada: ' + ordId + (proc ? ' [' + proc.label + ']' : '') + ' — ' + razon, 6000);
                    return false;
                }
                // Orden encontrada en otra etapa/categoría — moverla al paso escaneado
                matches = (!esGrupo && recoverable.length > 1) ? [recoverable[0]] : recoverable;
            }

            const procLabel = proc ? proc.label : (ACAB_STEPS.find(s => s.id === matches[0].etapa)?.label || matches[0].etapa);

            // ── 4. INICIA / PAUSA / REANUDA ─────────────────────────────
            if (isInicio) {
                let actionLabel = '⏱ Iniciando', actionColor = '#60a5fa';
                matches.forEach(o => {
                    const timerKey = o.id + (proc ? '_' + proc.pre : '');
                    const ex = _scanTimers[timerKey];
                    if (!ex) {
                        // Primera vez: inicia timer y mueve a la etapa
                        _scanTimers[timerKey] = { start: Date.now(), acc: 0, paused: false };
                        if (proc && proc.etapa) {
                            const idx = orders.findIndex(x => x.id === o.id);
                            orders[idx] = { ...orders[idx], etapa: proc.etapa };
                            etapaMap[o.id] = proc.etapa;
                            logMove(o, o.etapa, proc.etapa, 'escaneo-inicio');
                        }
                        actionLabel = '⏱ Iniciando'; actionColor = '#60a5fa';
                    } else if (!ex.paused) {
                        // Timer corriendo → pausar
                        _scanTimers[timerKey] = { start: null, acc: ex.acc + (Date.now() - ex.start), paused: true };
                        actionLabel = '⏸ Pausado'; actionColor = '#f59e0b';
                    } else {
                        // Timer pausado → reanudar
                        _scanTimers[timerKey] = { start: Date.now(), acc: ex.acc, paused: false };
                        actionLabel = '▶ Continuando'; actionColor = '#4ade80';
                    }
                });
                saveTimers(); saveBoard(); render();
                if (!silent) {
                    showToast(actionLabel + ' ' + procLabel + ': ' + matches.map(o => o.titulo.substring(0, 15)).join(', '));
                    showScanFlash(matches[0].titulo, actionLabel + (matches.length > 1 ? ' ×' + matches.length : ''), actionColor);
                }
                return true;
            }

            // ── 5. PASA: avanza todas las órdenes del grupo ──────────────
            let movedLabels = [];
            let _tocoLogsFull = false; // statsHistory (cierre de timer) y/o historial (llega a listo)
            matches.forEach(o => {
                const idx = orders.findIndex(x => x.id === o.id);
                const timerKey = o.id + (proc ? '_' + proc.pre : '');
                if (proc && proc.etapa && o.etapa !== proc.etapa) {
                    orders[idx] = { ...orders[idx], etapa: proc.etapa };
                    etapaMap[o.id] = proc.etapa;
                    logMove(o, o.etapa, proc.etapa, 'escaneo');
                }
                const oActual = orders[idx];
                const flow = [ETAPAS[0], ...getAcabFlow(oActual).map(sid => ACAB_STEPS.find(s => s.id === sid)).filter(Boolean), ETAPAS[1], ETAPAS[2]];
                const ei = flow.findIndex(et => et && et.id === oActual.etapa);
                if (ei < 0 || ei >= flow.length - 1) return;
                const nextStep = flow[ei + 1];
                const fromEtapa = oActual.etapa;
                if (_scanTimers[timerKey]) {
                    const tm = _scanTimers[timerKey];
                    const totalMs = typeof tm === 'number' ? (Date.now() - tm)
                        : tm.paused ? tm.acc : tm.acc + (Date.now() - tm.start);
                    const mins = Math.round(totalMs / 60000);
                    const ts = Date.now();
                    const tiempos = [...(oActual.tiemposReales || [])];
                    tiempos.push({ etapa: fromEtapa, label: procLabel, mins, ts });
                    orders[idx] = { ...orders[idx], tiemposReales: tiempos };
                    statsHistory.push({ ordId: oActual.id, titulo: oActual.titulo || oActual.baseTitulo || oActual.id, etapa: fromEtapa, label: procLabel, mins, cantidad: oActual.cantidad || 0, hojas: oActual.tabloidesSrc || 0, paginas: oActual.paginas || 0, gramaje: oActual.gramaje || '', tipoInteriores: oActual.tipoInteriores || '', tamano: oActual.tamano || '', maquina: oActual.maquina || '', ts });
                    autoCalibrate();
                    delete _scanTimers[timerKey];
                    saveTimers();
                    _tocoLogsFull = true;
                }
                orders[idx] = { ...orders[idx], etapa: nextStep.id };
                etapaMap[o.id] = nextStep.id;
                logMove(orders[idx], fromEtapa, nextStep.id, 'escaneo');
                if (nextStep.id === 'listo') { delete etapaMap[o.id]; pushHistorial(orders[idx]); _tocoLogsFull = true; }
                autoGroupFinish(o.id, nextStep.id);
                callScript(orders[idx], nextStep.id, fromEtapa);
                if (proc && proc.logScan) fetchLastSalidaRow(proc.label);
                movedLabels.push(nextStep.label);
            });

            autoMergeCheck();
            (_tocoLogsFull ? saveS() : saveBoard());
            render();
            const nextLbl = movedLabels[0] || '';
            const isSub = matches[0]?.tipo === 'int_sub' || matches[0]?.tipo === 'port_sub';
            const subNote = isSub && nextLbl === 'Empaque' ? ' (sub-orden → espera armado)' : '';
            if (!silent) {
                showToast('✅ ' + matches.map(o => o.titulo.substring(0, 15)).join(', ') + ' → ' + nextLbl + subNote);
                showScanFlash(matches[0].titulo, nextLbl + (matches.length > 1 ? ' ×' + matches.length : ''), '#f59e0b');
            }
            return true;
        }


        function sendScanToSheets(scanStr) {
            const url = cfg.scanLogUrl || cfg.scriptUrl;
            if (!url) { showToast('⚠️ Configura URL del script en ⚙️ Configuración'); return; }
            const clean = scanStr.replace(/%W/g, '|');
            showToast('⏳ Registrando en hoja...', 3500);
            const ctrl = new AbortController();
            const tid = setTimeout(() => ctrl.abort(), 12000);
            fetch(scriptURLBase(url, 'scan=' + encodeURIComponent(clean)), { signal: ctrl.signal })
                .then(r => { clearTimeout(tid); return r.text(); })
                .then(txt => {
                    const ok = txt && !txt.toUpperCase().includes('ERROR');
                    showToast(ok ? '✅ Registrado: ' + clean : '❌ Error al registrar: ' + txt.substring(0, 80), ok ? 3000 : 7000);
                })
                .catch(err => {
                    clearTimeout(tid);
                    const msg = err.name === 'AbortError' ? 'Sin respuesta (>12s)' : err.message;
                    showToast('❌ No se registró en Sheets: ' + msg, 7000);
                });
        }

        function sendMaqScanToSheets(scanStr) {
            const url = cfg.maqScanUrl || cfg.scanLogUrl || cfg.scriptUrl;
            if (!url) { showToast('⚠️ Configura URL Script Máquinas en ⚙️ Configuración'); return; }
            const clean = scanStr.replace(/%W/g, '|');
            fetch(scriptURLBase(url, 'action=maqscan&scan=' + encodeURIComponent(clean)), { mode: 'no-cors' }).catch(() => { });
            showToast('🖨️ Máquina registrada: ' + clean);
        }

        function showScanFlash(titulo, etapa, color) {
            let el = document.getElementById('scan-flash');
            if (!el) {
                el = document.createElement('div');
                el.id = 'scan-flash';
                el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1e293b;border:3px solid #f59e0b;color:#f1f5f9;padding:22px 32px;border-radius:16px;font-size:18px;font-weight:700;z-index:9999;text-align:center;transition:opacity .4s;pointer-events:none;box-shadow:0 0 40px #f59e0b44';
                document.body.appendChild(el);
            }
            el.style.borderColor = color;
            el.style.boxShadow = `0 0 40px ${color}44`;
            el.innerHTML = `<div style="font-size:28px;margin-bottom:6px">📦</div><div style="font-size:14px;color:#94a3b8;margin-bottom:4px">${e(titulo.substring(0, 32))}</div><div style="color:${color}">→ ${e(etapa)}</div>`;
            el.style.opacity = '1';
            clearTimeout(el._to);
            el._to = setTimeout(() => { el.style.opacity = '0'; }, 2500);
        }

        // ═══════════════════════════════════════════════════
        //  INICIO
        // ═══════════════════════════════════════════════════
        // Esperar a que el login anónimo termine antes de cargar la app
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                loadS();
            }
        });
    </script>
