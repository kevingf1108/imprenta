<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producción — Imprenta</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px
        }

        ::-webkit-scrollbar-track {
            background: #1e293b
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px
        }

        .board {
            display: flex;
            gap: 10px;
            padding: 14px;
            overflow-x: auto;
            min-height: calc(100vh - 68px);
            align-items: flex-start
        }

        .col {
            min-width: 245px;
            max-width: 245px;
            background: #1e293b;
            border-radius: 12px;
            padding: 11px;
            flex-shrink: 0
        }

        .col.union-col {
            min-width: 280px;
            max-width: 280px;
            background: #1a1500
        }

        .col-hdr {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 2px 9px;
            border-bottom: 2px solid;
            margin-bottom: 8px
        }

        .card {
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            border-left: 3px solid #334155;
            cursor: pointer;
            transition: background .15s;
            margin-bottom: 7px
        }

        .card:hover {
            background: #162032
        }

        .card.urg {
            background: #160808
        }

        .card.int-card {
            border-left-color: #818cf8
        }

        .card.port-card {
            border-left-color: #c084fc
        }

        .card.union-card {
            border-left-color: #f59e0b;
            background: #1a1000
        }

        .card.merged-card {
            border-left-color: #4ade80;
            background: #061a0c
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600
        }

        .btn {
            padding: 9px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: opacity .15s
        }

        .btn:hover {
            opacity: .88
        }

        .btn-p {
            background: #3b82f6;
            color: #fff
        }

        .btn-d {
            background: #ef4444;
            color: #fff
        }

        .btn-g {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #334155
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 6px
        }

        .btn-merge {
            background: #f59e0b;
            color: #0a0a00;
            font-weight: 800;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
            animation: pulse 1.5s infinite
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 #f59e0b66
            }

            50% {
                box-shadow: 0 0 0 6px transparent
            }
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .78);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px
        }

        .modal {
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 600px;
            max-height: 93vh;
            overflow-y: auto
        }

        .inp {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 9px 12px;
            color: #e2e8f0;
            font-size: 14px;
            margin-top: 4px

        .inp:focus {

            border-color: transparent

        .lbl {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 12px;
            font-weight: 500
        }

        .g2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .g3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px
        }

        .bico {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 15px;
            line-height: 1;
            color: #94a3b8
        }

        .bico:hover {
            background: #334155
        }

        .ell {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .step {
            display: flex;
            justify-content: space-between;
            padding: 5px 9px;
            background: #0f172a;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 3px
        }

        .est-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px;
            margin-top: 12px
        }

        .kcard {
            background: #1e293b;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px
        }

        .capbar {
            height: 10px;
            background: #334155;
            border-radius: 999px;
            overflow: hidden
        }

        .tv-wrap {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 200;
            display: flex;
            flex-direction: column;
            padding: 14px 18px
        }

        .tv-col {
            flex: 1;
            background: #0f172a;
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden
        }

        .seg {
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            background: #0f172a;
            color: #94a3b8
        }

        .gantt-bar {
            position: absolute;
            height: 26px;
            top: 5px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0 6px;
            font-size: 11px;
            font-weight: 700;
            overflow: hidden;
            white-space: nowrap
        }

        .gantt-bar:hover {
            opacity: .82;
            z-index: 10
        }

        .gantt-row {
            display: flex;
            align-items: stretch;
            border-bottom: 1px solid #1e293b;
            min-height: 36px
        }

        .gantt-label {
            width: 160px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            border-right: 1px solid #1e293b;
            background: #0a0f1e
        }

        .gantt-track {
            position: relative;
            flex: 1;
            min-height: 36px
        }

        .split-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            padding: 12px;
            background: #0a0f1e;
            border-radius: 10px;
            border: 1px solid #334155;
            cursor: pointer
        }

        .split-toggle.on {
            border-color: #f59e0b;
            background: #1a1200
        }

        .acab-col {
            min-width: 185px;
            max-width: 185px;
            background: #130a2e
        }

        .card {
            cursor: grab
        }

        .card:active {
            cursor: grabbing
        }

        .card.dragging {
            opacity: .4;
            transform: scale(.97)
        }

        .col.drag-over {
            outline: 2px dashed #f59e0b;
            background: #1a1200
        }

        .col.drag-over-ok {
            outline: 2px dashed #4ade80;
            background: #061a0c
        }

        @media(max-width:600px) {

            .g2,
            .g3 {
                grid-template-columns: 1fr
            }
        }

    <div id="root"></div>
    <script>
        'use strict';
        // ── Auto-actualización ───────────────────────────────
        const APP_VERSION = 'v8.99999';
        let _pendingReload = false;
        // No interrumpe a media acción (modal abierto, arrastrando, escribiendo) — reintenta
        // cada 30s hasta que esté libre, y avisa unos segundos antes de recargar.
        function tryReload() {
            if (!_pendingReload) return;
            const activeTag = document.activeElement && document.activeElement.tagName;
            const busy = (typeof modalId !== 'undefined' && modalId !== undefined) || showCfg || showSync || _dragId ||
                activeTag === 'INPUT' || activeTag === 'TEXTAREA';
            if (busy) return;
            showToast('🔄 Hay una versión nueva — actualizando...', 3000);
            setTimeout(() => location.reload(true), 2500);
        }
        async function checkForUpdate() {
            try {
                const r = await fetch('./version.txt?_=' + Date.now(), { cache: 'no-cache' });
                if (!r.ok) return;
                const v = (await r.text()).trim();
                if (v && v !== APP_VERSION) _pendingReload = true;
            } catch { }
            tryReload();
        }
        setTimeout(checkForUpdate, 4000);
        setInterval(checkForUpdate, 5 * 60 * 1000);
        setInterval(tryReload, 30 * 1000);
        // ── Firebase ────────────────────────────────────────
        firebase.initializeApp({
            apiKey: "AIzaSyB40xYmdLxTlIFyPbP3sqnru35WMNpHs_0",
            authDomain: "imprenta-10c73.firebaseapp.com",
            databaseURL: "https://imprenta-10c73-default-rtdb.firebaseio.com",
            projectId: "imprenta-10c73",
            storageBucket: "imprenta-10c73.firebasestorage.app",
            messagingSenderId: "80250247267",
            appId: "1:80250247267:web:36ee4b66a593feba630056"
        });
        // ── App Check (reCAPTCHA v3) ─────────────────────────
        // Prueba que las peticiones a Firebase vienen de esta app real, no de un script
        // cualquiera que solo tenga el apiKey. Mientras no se "exija" en la consola de
        // Firebase (Build → App Check → Realtime Database → Enforce), esto solo observa —
        // no bloquea a nadie. Se activa de verdad ahí, no aquí.
        try {
            firebase.appCheck().activate(
                new firebase.appCheck.ReCaptchaV3Provider('6Lda9IotAAAAAAeGwQ5j48cvsJv_rl-x6_dxVwWK'),
                true
            );
        } catch (e) { console.error('App Check no se pudo activar:', e); }
        const _db = firebase.database();
        const _ref = _db.ref('imprenta');

        // ── Login anónimo: se ejecuta solo, sin que el usuario haga nada ──
        firebase.auth().signInAnonymously().catch(err => {
            console.error('Error de login anónimo:', err);
            alert('No se pudo conectar de forma segura. Recarga la página. Si el problema sigue, avisa al administrador.');
        });
        // ═══════════════════════════════════════════════════
        //  CONSTANTES
        // ═══════════════════════════════════════════════════
        // 6 etapas: flujo normal (imp→acabados→empaque→listo)
        // Flujo split: imp → pre_union (int/port) → union → acabados → empaque → listo
        const ETAPAS = [
            { id: 'impresion', label: 'Impresión', full: 'Impresión', icon: '🖨️', color: '#fb923c' },
            { id: 'empaque', label: 'Empaque', full: 'Termo · Empaque', icon: '📦', color: '#14b8a6' },
            { id: 'listo', label: 'Listo', full: 'Listo para Entrega', icon: '✅', color: '#4ade80' },
        ];

        // ─────────────────────────────────────────────────────────────────────────────
        //  SUB-PASOS DE ACABADOS
        //  Flujos reales por encuadernación y tipo de sub-orden:
        //
        //  NORMAL / ENGRAPADO / ESPIRAL:
        //    INT:   ci
        //    PORT:  pl → ci  (+ cc+ap si pasta_dura / ponchado si espiral)
        //    UNION: pg → cf → te  (engrapado: en → te; espiral: es → te)
        //
        //  PASTA DURA:
        //    INT:   ci → pg → cf → cdc
        //    PORT:  pl → ci → cc → ap
        //    UNION: ms → te
        // ─────────────────────────────────────────────────────────────────────────────
        const ACAB_STEPS = [
            { id: 'acab_pl', label: 'Plastificado', icon: '🪄', color: '#818cf8' },
            { id: 'acab_ci', label: 'Corte Inicial', icon: '✂️', color: '#c084fc' },
            { id: 'acab_pg', label: 'Hotmelt', icon: '🔥', color: '#f97316' },
            { id: 'acab_cf', label: 'Corte Final', icon: '🔪', color: '#fb923c' },
            { id: 'acab_cdc', label: 'Cinta Doble Cara', icon: '🩹', color: '#e879f9' },
            { id: 'acab_cc', label: 'Corte Cartón', icon: '📐', color: '#a78bfa' },
            { id: 'acab_ap', label: 'Armado Portada', icon: '🛠️', color: '#f59e0b' },
            { id: 'acab_ms', label: 'Mesa de Trabajo', icon: '🔗', color: '#4ade80' },
            { id: 'acab_pi', label: 'Ponchado Int', icon: '🔩', color: '#38bdf8' },
            { id: 'acab_pp', label: 'Ponchado Port', icon: '🔩', color: '#22d3ee' },
            { id: 'acab_en', label: 'Engrapado', icon: '📌', color: '#facc15' },
            { id: 'acab_es', label: 'Espiralado', icon: '🌀', color: '#2dd4bf' },
            { id: 'acab_te', label: 'Termo', icon: '🌡️', color: '#14b8a6' },
        ];

        // Devuelve la secuencia exacta de pasos para una orden según tipo y encuadernación
        function getAcabFlow(o) {
            const enc = o.tipoEncuadernacion || 'normal';
            const tipo = o.tipo || 'normal';
            const isInt = tipo === 'int_sub';
            const isPort = tipo === 'port_sub';
            const isUnion = tipo === 'union_result';

            // ── INTERIORES ──────────────────────────────────────────────
            if (isInt) {
                if (enc === 'pasta_dura') return ['acab_ci', 'acab_pg', 'acab_cf', 'acab_cdc'];
                if (enc === 'espiral' || enc === 'espiral_pd') return ['acab_ci', 'acab_pi'];
                return ['acab_ci']; // normal, engrapado
            }

            // ── PORTADA ─────────────────────────────────────────────────
            if (isPort) {
                if (enc === 'pasta_dura') return ['acab_pl', 'acab_ci', 'acab_cc', 'acab_ap'];
                if (enc === 'espiral_pd') return ['acab_pl', 'acab_ci', 'acab_cc', 'acab_ap', 'acab_pp'];
                if (enc === 'espiral') return ['acab_pl', 'acab_ci', 'acab_pp'];
                return ['acab_pl', 'acab_ci']; // normal, engrapado
            }

            // ── FLUJO COMPLETO (union_result y órdenes normales sin separar) ─
            // El union_result usa el mismo flujo completo que normal para poder
            // regresar a Plastificado / Corte Inicial si se necesita corregir algo.
            if (enc === 'pasta_dura') return ['acab_pl', 'acab_ci', 'acab_pg', 'acab_cf', 'acab_cdc', 'acab_cc', 'acab_ap', 'acab_ms', 'acab_te'];
            if (enc === 'engrapado') return ['acab_pl', 'acab_ci', 'acab_en', 'acab_te'];
            if (enc === 'espiral_pd') return ['acab_pl', 'acab_ci', 'acab_pi', 'acab_cc', 'acab_ap', 'acab_pp', 'acab_es', 'acab_te'];
            if (enc === 'espiral') return ['acab_pl', 'acab_ci', 'acab_pi', 'acab_pp', 'acab_es', 'acab_te'];
            return ['acab_pl', 'acab_ci', 'acab_pg', 'acab_cf', 'acab_te']; // normal/rústica
        }

        // Etapa actual de acabados: primera que corresponde al stepActual de la orden
        // Si etapa es 'acab_*' lo gestionamos aparte
        function isAcabEtapa(id) { return id && id.startsWith('acab_'); }
        // Posición de una etapa dentro del flujo natural de ESTA orden — 'listo' siempre es
        // la más alta. Sirve para no dejar que un sync con datos viejos regrese una orden que
        // localmente ya iba más avanzada (ej. Sheets todavía no limpió la fila de "listo").
        function etapaRank(o) {
            if (o.etapa === 'listo') return 999;
            const flow = [ETAPAS[0], ...getAcabFlow(o).map(sid => ACAB_STEPS.find(s => s.id === sid)).filter(Boolean), ETAPAS[1], ETAPAS[2]];
            const idx = flow.findIndex(s => s && s.id === o.etapa);
            return idx >= 0 ? idx : -1;
        }
        function allEtapas(ordList) {
            // Muestra TODAS las columnas de acabados por las que cualquier orden activa pasará,
            // incluyendo pasos futuros y anteriores, para que no desaparezcan al mover tarjetas
            const relevantAcab = new Set();
            ordList.filter(o => o.etapa !== 'listo' && !o._merged).forEach(o => {
                // Agregar todos los pasos del flujo completo de esta orden
                getAcabFlow(o).forEach(s => relevantAcab.add(s));
            });
            return [
                ...ETAPAS.slice(0, 1),
                ...ACAB_STEPS.filter(s => relevantAcab.has(s.id)),
                ...ETAPAS.slice(1),
            ];
        }
        const TIPOS_ENC = [
            { id: 'normal', label: 'Rústica / Normal', icon: '📖', color: '#94a3b8' },
            { id: 'pasta_dura', label: 'Pasta dura pegada', icon: '📕', color: '#f97316' },
            { id: 'engrapado', label: 'Engrapado', icon: '📌', color: '#facc15' },
            { id: 'espiral', label: 'Espiral / Wire', icon: '🔩', color: '#38bdf8' },
            { id: 'espiral_pd', label: 'Espiral + Pasta dura', icon: '🔩', color: '#a78bfa' },
        ];
        const MAQUINAS = [
            { id: 'oce6320', label: 'OCE 6320', steps: ['iib'], grupo: '🖨️ Impresión B&N' },
            { id: 'titan', label: 'Titan 6180', steps: ['iib'], grupo: '🖨️ Impresión B&N' },
            { id: 'c1352', label: 'Color 1352', steps: ['iic', 'ip'], grupo: '🎨 Impresión Color' },
            { id: 'c1351', label: 'Color 1351', steps: ['iic', 'ip'], grupo: '🎨 Impresión Color' },
            { id: 'c1353', label: 'Color 1353', steps: ['iic', 'ip'], grupo: '🎨 Impresión Color' },
            { id: 'c10010', label: 'Color 10010', steps: ['iic', 'ip'], grupo: '🎨 Impresión Color' },
            { id: 'plast', label: 'Plastificadora', steps: ['pl'], grupo: '✂️ Acabados' },
            { id: 'ci1', label: 'Cortadora Ini.1', steps: ['ci', 'cp'], grupo: '✂️ Acabados' },
            { id: 'ci2', label: 'Cortadora Ini.2', steps: ['ci', 'cp'], grupo: '✂️ Acabados' },
            { id: 'peg1', label: 'Pegadora 1', steps: ['pg'], grupo: '✂️ Acabados' },
            { id: 'peg2', label: 'Pegadora 2', steps: ['pg'], grupo: '✂️ Acabados' },
            { id: 'peg3', label: 'Pegadora 3', steps: ['pg'], grupo: '✂️ Acabados' },
            { id: 'cf1', label: 'Corte Final 1', steps: ['cf'], grupo: '✂️ Acabados' },
            { id: 'cf2', label: 'Corte Final 2', steps: ['cf'], grupo: '✂️ Acabados' },
            { id: 'ponch', label: 'Ponchadora', steps: ['pi', 'pp'], grupo: '✂️ Acabados' },
            { id: 'engr', label: 'Engrapadora', steps: ['en'], grupo: '✂️ Acabados' },
            { id: 'espir', label: 'Espiraladora', steps: ['es'], grupo: '✂️ Acabados' },
            { id: 'cortC', label: 'Corte Cartón', steps: ['cc'], grupo: '✂️ Acabados' },
            { id: 'armd', label: 'Armado PD/Mesa', steps: ['ap', 'ms', 'cdc'], grupo: '✂️ Acabados' },
            { id: 'termo', label: 'Termo Empaque', steps: ['te'], grupo: '📦 Empaque' },
        ];
        const ORD_COLORS = ['#3b82f6', '#22c55e', '#f97316', '#a855f7', '#ec4899', '#14b8a6', '#f59e0b', '#8b5cf6', '#ef4444', '#06b6d4', '#84cc16', '#f43f5e'];
        const MUESTRA_COLORS = ['#93c5fd', '#86efac', '#fdba74', '#d8b4fe', '#f9a8d4', '#5eead4', '#fde68a', '#c4b5fd', '#fca5a5', '#67e8f9', '#d9f99d', '#fda4af'];
        const CFG0 = {
            nombreImprenta: 'Mi Imprenta', horasDia: 10, startHour: 8, pptDefault: 8, portaPptDefault: 2,
            bufferFactor: 1.3, calibRangeMin: 0.5, calibRangeMax: 2.0,
            scriptUrl: '', // URL del Google Apps Script Web App para marcar Listo en Sheets
            scriptToken: '', // Clave secreta — debe coincidir con la constante TOKEN dentro del Apps Script
            maq: {
                byn_fast: 150, byn_slow: 80, color_normal: 50, color_grueso: 25, color_slow_n: 40, color_slow_g: 20,
                corteInicial: 200, plast_vel: 5, plast_hoja: 0.475,
                pegado_150: 2, pegado_500: 1, cf_150: 6, cf_500: 3,
                ponchadora: 200, engrapadora: 2, corte_carton: 10, armado_pd: 0.33, mesa_trabajo: 0.5, espiralado: 2, termo: 10
            },
            setup: { byn: 4, color: 7, plastificado: 3, pegado: 15, corteFinal: 5, corteInicial: 0, termo: 0 },
        };

        // tipo: 'normal' | 'int_sub' | 'port_sub' | 'union_result'
        // grupoId: shared ID for split orders
        const SAMPLE = [

            Object.entries(buddyGroups).forEach(([k, ids]) => {
                if (ids.length >= 2) ids.forEach(id => { buddyKey[id] = k; });
            });

            // Pre-calcular tiempo mínimo de pasos pre-unión por grupo (suma de duraciones)
            // Así cada miembro espera al más lento de su grupo antes de entrar a la pegadora
            const groupPreJoinMin = {}; // groupKey → max(suma pre-join de cada miembro)
            sorted.forEach(o => {
                if (!buddyKey[o.id]) return;
                const t = calcT(o, c);
                const fi = etapaFaseStart[o.etapa] ?? 0;
                const fo = ['imp', 'acab', 'emp'];
                const preJoinDur = t.pasos.filter(p => fo.indexOf(p.fase) >= fi && !JOIN_STEPS.has(p.id))
                    .reduce((s, p) => s + p.min, 0);
                const gkey = buddyKey[o.id];
                groupPreJoinMin[gkey] = Math.max(groupPreJoinMin[gkey] || 0, preJoinDur);
            });

            // groupJoinSlot[gkey_stepId] = { start, end } — slot compartido ya programado por el líder del grupo
            const groupJoinSlot = {};
            // groupTitles[gkey] = lista de títulos de los miembros del grupo
            const groupTitles = {};
            sorted.forEach(o => {
                if (!buddyKey[o.id]) return;
                const gkey = buddyKey[o.id];
                if (!groupTitles[gkey]) groupTitles[gkey] = [];
                groupTitles[gkey].push(o.titulo || o.id);
            });

            sorted.forEach(o => {
                const t = calcT(o, c), color = colorMap[o.id];
                const fi = etapaFaseStart[o.etapa] ?? 0;
                const fo = ['imp', 'acab', 'emp'];
                const remaining = t.pasos.filter(p => fo.indexOf(p.fase) >= fi);
                ordState[o.id] = { intEnd: 0, portEnd: 0, mainEnd: 0 };
                const INT_IDS = ['iib', 'iic', 'ci', 'pg', 'cf', 'cdc', 'pi'];
                const PORT_IDS = ['ip', 'pl', 'cp', 'cc', 'ap', 'pp'];
                const JOIN_IDS = ['pg', 'cf', 'ms', 'en', 'es', 'te'];
                remaining.forEach(step => {
                    const cands = MAQUINAS.filter(m => m.steps.includes(step.id));
                    if (!cands.length) return;

                    // Grupos hermanos en pasos de unión: reutilizar el slot del líder, no crear nueva barra
                    if (JOIN_STEPS.has(step.id) && buddyKey[o.id]) {
                        const gkey = buddyKey[o.id];
                        const slotKey = gkey + '_' + step.id;
                        if (groupJoinSlot[slotKey]) {
                            // Soy secundario: heredar tiempos del líder, sin nueva barra ni consumo de máquina
                            const { end: je } = groupJoinSlot[slotKey];
                            ordState[o.id].mainEnd = Math.max(ordState[o.id].mainEnd, je);
                            return;
                        }
                        // Soy el líder: programar normalmente y guardar el slot
                    }

                    const mach = cands.reduce((best, m) => machAvail[m.id] < machAvail[best.id] ? m : best);
                    let earliest = machAvail[mach.id];
                    if (INT_IDS.includes(step.id)) earliest = Math.max(earliest, ordState[o.id].intEnd);
                    if (PORT_IDS.includes(step.id)) earliest = Math.max(earliest, ordState[o.id].portEnd);
                    if (JOIN_IDS.includes(step.id) && o.tipo === 'normal') earliest = Math.max(earliest, ordState[o.id].intEnd, ordState[o.id].portEnd, ordState[o.id].mainEnd);
                    if (o.tipo === 'union_result' || o.tipo === 'int_sub' || o.tipo === 'port_sub') earliest = Math.max(earliest, ordState[o.id].mainEnd);
                    // Líder del grupo hermano: esperar al miembro más lento antes de unir
                    if (JOIN_STEPS.has(step.id) && buddyKey[o.id]) {
                        earliest = Math.max(earliest, groupPreJoinMin[buddyKey[o.id]] || 0);
                    }
                    const start = earliest, end = start + step.min;
                    machAvail[mach.id] = end;
                    if (INT_IDS.includes(step.id)) ordState[o.id].intEnd = Math.max(ordState[o.id].intEnd, end);
                    if (PORT_IDS.includes(step.id)) ordState[o.id].portEnd = Math.max(ordState[o.id].portEnd, end);
                    if (JOIN_IDS.includes(step.id) || !INT_IDS.includes(step.id) && !PORT_IDS.includes(step.id)) ordState[o.id].mainEnd = Math.max(ordState[o.id].mainEnd, end);

                    // Guardar slot si es líder de grupo en paso de unión
                    let barTitulo = o.titulo, barOrdId = o.id;
                    if (JOIN_STEPS.has(step.id) && buddyKey[o.id]) {
                        const gkey = buddyKey[o.id];
                        groupJoinSlot[gkey + '_' + step.id] = { start, end };
                        const n = buddyGroups[gkey].length;
                        barTitulo = `Grupo ${gkey} (${n} partes)`;
                        barOrdId = gkey;
                    }

                    blocks.push({
                        ordId: barOrdId, titulo: barTitulo, cliente: o.cliente, tipo: o.tipo || 'normal',
                        stepId: step.id, stepNom: step.nom, machId: mach.id, machLabel: mach.label,
                        start, end, dur: step.min, color, urgente: o.urgente, fechaLimite: o.fechaLimite,
                        buddyGroup: buddyKey[o.id] || null,
                        _isMuestra: o._isMuestra || false,
                    });
                });
            });
            // finishMin: minutos desde ahora hasta que cada orden termina TODO lo que le falta —
            // ya respeta máquinas en paralelo, orden de prioridad real y grupos hermanos.
            const finishMin = {};
            sorted.forEach(o => {
                const st = ordState[o.id];
                finishMin[o.id] = Math.max(st.intEnd, st.portEnd, st.mainEnd);
            });
            return { blocks, colorMap, finishMin };
        }

        // ═══════════════════════════════════════════════════
        //  SINCRONIZACIÓN CON GOOGLE SHEETS
        // ═══════════════════════════════════════════════════

        // Parser CSV robusto (comas y saltos de línea dentro de comillas, comillas escapadas "")
        // Recorre carácter por carácter en vez de cortar por '\n' primero — un salto de línea
        // DENTRO de un campo con comillas (ej. una descripción de varias líneas) no debe partir la fila.
        function parseCSV(text) {
            const rows = [];
            let row = [], cur = '', inQ = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (inQ) {
                    if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
                    else cur += c;
                } else if (c === '"') inQ = true;
                else if (c === ',') { row.push(cur.trim()); cur = ''; }
                else if (c === '\r') { /* ignorar, \n cierra la fila */ }
                else if (c === '\n') { row.push(cur.trim()); rows.push(row); row = []; cur = ''; }
                else cur += c;
            }
            if (cur !== '' || row.length) { row.push(cur.trim()); rows.push(row); }
            const nonEmpty = rows.filter(r => r.some(v => v));
            if (!nonEmpty.length) return [];
            const headers = nonEmpty[0];
            return nonEmpty.slice(1).map(vals => {
                const obj = {};
                headers.forEach((h, i) => obj[h.toLowerCase().trim()] = (vals[i] || '').trim());
                return obj;
            });
        }

        // Busca un valor de columna por múltiples nombres posibles
        function col(row, ...names) { for (const n of names) { const v = row[n.toLowerCase()]; if (v !== undefined && v !== '') return v; } return ''; }

        // Ya viene en yyyy-MM-dd (ISO) desde el Apps Script — sin ambigüedad de día/mes
        const _ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;
        // Convierte fecha "16/4/2026" o "16/04/2026" a "2026-04-16"
        function parseDMDate(s) {
            if (!s) return '';
            if (_ISO_DATE.test(s)) return s;
            const p = s.split('/');
            if (p.length !== 3) return '';
            return `${p[2]}-${p[1].padStart(2, '0')}-${p[0].padStart(2, '0')}`;
        }
        // MM/DD/YY o MM/DD/YYYY — para fechas escritas a mano en la hoja de Muestras
        function parseMDYDate(s) {
            if (!s) return '';
            if (_ISO_DATE.test(s)) return s;
            const p = s.split('/');
            if (p.length !== 3) return '';
            const yr = p[2].length === 2 ? '20' + p[2] : p[2];
            return `${yr}-${p[0].padStart(2, '0')}-${p[1].padStart(2, '0')}`;
        }

        // Detecta tipo de encuadernación desde descripción/actividades
        function detectEnc(desc, acab) {
            const d = (desc + ' ' + (acab || '')).toLowerCase();
            if (d.includes('pasta dura') || /[hg]v?\d+\.8/.test(d)) return 'pasta_dura';
            if (d.includes('engrap') || d.includes('d06')) return 'engrapado';
            if (d.includes('espiral') || d.includes('wire')) return 'espiral';
            return 'normal';
        }

        // Detecta gramaje desde nombre de papel (≤170g = normal, >170g = grueso)
        function detectGramaje(papel) {
            const m = (papel || '').match(/(\d+)\s*g/i);
            return m && parseInt(m[1]) >= 170 ? 'grueso' : 'normal';
        }

        // Mapea una fila de la hoja de IMPRESIÓN a una orden
        function mapImpRow(row) {
            const nombre = col(row, 'nombre', 'name', 'titulo');
            const itemNum = col(row, '# item', 'item', '#item', 'numero', 'order');
            const po = col(row, 'p_o', 'tipo', 'interior', 'portada');
            const urg = col(row, 'urgencia', 'urgency', 'prioridad');
            const entrega = col(row, 'entrega', 'delivery', 'fecha entrega', 'f. entrega');
            const listo = col(row, 'listo', 'done', 'ready').toLowerCase() === 'true';
            const desc = col(row, 'description', 'descripcion', 'desc');
            // _listoInSheets: evita que etapaMap sobreescriba cuando Sheets ya avanzó la orden
            const colorBn = col(row, 'color_bn', 'color', 'tipo color');
            const papel = col(row, 'papel', 'paper', 'papel/cartulina');
            const tabs = parseInt((col(row, 'tabloides') || '').replace(/[^\d]/g, '')) || 0;
            const cantidad = parseInt(col(row, 'cantidad', 'quantity', 'qty', 'cant')) || 0;

            if (!nombre || !itemNum) return null;

            const esInt = po.toLowerCase().includes('int');
            const tipo = esInt ? 'int_sub' : 'port_sub';
            const enc = detectEnc(desc, '');
            // listo=true en impresión → entra al primer paso de acabados de su flujo
            const _impFlow = getAcabFlow({ tipo, tipoEncuadernacion: enc });
            const etapa = listo ? (_impFlow[0] || 'empaque') : 'impresion';

            return {
                id: `${itemNum}-${esInt ? 'I' : 'P'}`,
                grupoId: `${itemNum}`,
                tipo, baseTitulo: nombre,
                titulo: `${esInt ? 'INT' : 'PORT'} — ${nombre}`,
                cliente: '', cantidad,
                tabloidesSrc: tabs, ppt: 8, portaPpt: 2,
                paginas: tabs * 8,
                tipoInteriores: colorBn.toLowerCase().includes('bn') || colorBn.toLowerCase().includes('b/n') ? 'byn' : 'color',
                gramaje: tipo === 'port_sub' ? 'grueso' : detectGramaje(papel),
                tipoEncuadernacion: enc,
                fechaLimite: parseDMDate(entrega),
                etapa, urgente: urg.toLowerCase().includes('urgente'),
                notas: desc.substring(0, 120),
                _fromSheets: true, _listoInSheets: listo,
                fechaCreacion: new Date().toISOString().split('T')[0],
            };
        }

        // Mapea una fila de la hoja de ACABADOS a una orden
        function mapAcabRow(row) {
            const nombre = col(row, 'nombre', 'name', 'titulo');
            const itemNum = col(row, '# item', 'item', '#item');
            const urg = col(row, 'urgencia', 'urgency', 'prioridad');
            const entrega = col(row, 'entrega', 'delivery');
            const listo = col(row, 'listo', 'done', 'ready').toLowerCase() === 'true';
            const qty = parseInt(col(row, 'quantity', 'cantidad', 'qty')) || 0;
            const acab = col(row, 'acabados', 'terminados', 'actividades');
            const hojas = parseInt(col(row, 'hojas', 'sheets', 'tabloides', 'tabs')) || 0;
            const status = col(row, 'status', 'estado');

            if (!nombre || !itemNum) return null;

            // Determina si es INT o PORT desde el status o asumimos "union_result" si solo hay 1 fila
            // En acabados normalmente ya vienen como trabajo unido
            const enc = detectEnc(acab, '');
            // etapa_actual en el sheet manda sobre todo lo demás
            const etapaActual = col(row, 'etapa_actual', 'etapa actual', 'etapa');
            const etapa = etapaActual ? etapaActual : (listo ? 'empaque' : 'acab_pl');

            return {
                id: `${itemNum}-A`,
                grupoId: `${itemNum}`,
                tipo: 'union_result', baseTitulo: nombre, titulo: nombre,
                cliente: '', cantidad: qty,
                paginas: hojas * 2, tabloidesSrc: hojas, ppt: 8, portaPpt: 2,
                tipoInteriores: 'byn', gramaje: 'normal',
                tipoEncuadernacion: enc,
                fechaLimite: parseDMDate(entrega),
                etapa, urgente: urg.toLowerCase().includes('urgente'),
                notas: acab.substring(0, 120),
                _fromSheets: true,
                fechaCreacion: new Date().toISOString().split('T')[0],
            };
        }

        // Mapea una fila de la hoja de MUESTRAS a una orden
        const _ETAPAS_VALIDAS = new Set(['impresion', 'empaque', 'listo', 'acab_pl', 'acab_ci', 'acab_pg', 'acab_cf', 'acab_cdc', 'acab_cc', 'acab_ap', 'acab_ms', 'acab_pi', 'acab_pp', 'acab_en', 'acab_es', 'acab_te']);
        function mapMuestraRow(row) {
            const nombre = col(row, 'group name', 'nombre', 'name', 'titulo');
            const itemNum = col(row, '# item', '#item', '# item', '#order', 'item');
            const urg = col(row, 'urgencia', 'urgency', 'prioridad');
            const entrega = col(row, 'entrega', 'delivery');
            const procesado = col(row, 'eliminar', 'procesado', 'terminado', 'listo', 'done', 'ready').toLowerCase() === 'true';
            const qty = Math.max(parseInt(col(row, 'up (pz tab)', 'quantity', 'cantidad', 'qty')) || 0, 1);
            const hojas = Math.max(parseInt(col(row, 'hojas', 'sheets', 'tabloides', 'tabs')) || 0, 1);
            const acab = col(row, 'acabados', 'terminados', 'actividades');
            const colorBn = col(row, 'color_bn', 'color bn', 'tipo_color');
            const notas = col(row, 'description', 'dresciption', 'descripcion', 'notas');
            // Usar etapa_actual solo si es un valor válido — quitar prefijo "M " si existe
            const statusRaw = col(row, 'etapa_actual', 'etapa actual', 'etapa').replace(/^M\s+/i, '').trim();
            const etapaActual = _ETAPAS_VALIDAS.has(statusRaw) ? statusRaw : '';

            if (!nombre || !itemNum) return null;
            if (procesado) return null;

            const enc = detectEnc(acab, '') || 'normal';

            return {
                id: `${itemNum}-M`,
                grupoId: `${itemNum}-M`,
                tipo: 'muestra', baseTitulo: nombre, titulo: `M · ${nombre}`,
                cliente: '', cantidad: qty,
                paginas: hojas * 2, tabloidesSrc: hojas, ppt: 8, portaPpt: 2,
                tipoInteriores: colorBn.toLowerCase().includes('bn') ? 'byn' : 'color',
                gramaje: 'normal',
                tipoEncuadernacion: enc,
                fechaLimite: parseMDYDate(entrega),
                etapa: etapaActual || 'impresion',
                urgente: urg.toLowerCase().includes('urgente'),
                notas: notas.substring(0, 120),
                _fromSheets: true,
                _isMuestra: true,
                fechaCreacion: new Date().toISOString().split('T')[0],
            };
        }

        // Actualiza Status + "Fecha queue" en el spreadsheet de tracking externo
        function scriptURLBase(base, qsNoQ) {
            return base + '?' + qsNoQ + (cfg.scriptToken ? '&token=' + encodeURIComponent(cfg.scriptToken) : '');
        }
        function scriptURL(qsNoQ) { return scriptURLBase(cfg.scriptUrl, qsNoQ); }

        function callTracking(order, toEtapa) {
            if (!cfg.scriptUrl) return;
            const item = encodeURIComponent(String(order.grupoId || order.id).replace(/-[MAPm]$/, '').trim());
            const etapaTracking = order._isMuestra ? 'M ' + toEtapa : toEtapa;
            fetch(scriptURL('action=updateTracking&item=' + item + '&etapa=' + encodeURIComponent(etapaTracking) + '&trackingId=' + encodeURIComponent(TRACKING_SHEET_ID)), { mode: 'no-cors' }).catch(() => { });
        }

        // Marca Listo=TRUE en Google Sheets cuando se avanza una orden
        // fromEtapa: etapa anterior (antes del movimiento)
        function callScript(order, toEtapa, fromEtapa) {
            if (!cfg.scriptUrl) return;
            callTracking(order, toEtapa);
            // muestras — siempre quedan en M imp, solo se actualiza etapa_actual
            if (order._isMuestra && order.grupoId) {
                const it = encodeURIComponent(String(order.grupoId).replace(/-M$/, '').trim());
                if (toEtapa === 'listo') {
                    fetch(scriptURL('action=marcarProcesado&item=' + it), { mode: 'no-cors' }).catch(() => { });
                } else {
                    fetch(scriptURL('action=updateEtapa&item=' + it + '&etapa=' + encodeURIComponent(toEtapa) + '&hoja=muestras'), { mode: 'no-cors' }).catch(() => { });
                }
                return;
            }
            // union_result (filas de "Acabado org") — actualizar etapa o mover según destino
            if (order.tipo === 'union_result' && order.grupoId) {
                const it = encodeURIComponent(String(order.grupoId).trim());
                if (toEtapa === 'empaque') {
                    fetch(scriptURL('action=moverAempacado&item=' + it), { mode: 'no-cors' }).catch(() => { });
                } else if (toEtapa === 'listo') {
                    fetch(scriptURL('action=marcarListo&item=' + it + '&hoja=acabados'), { mode: 'no-cors' }).catch(() => { });
                } else if (isAcabEtapa(toEtapa)) {
                    fetch(scriptURL('action=updateEtapa&item=' + it + '&etapa=' + encodeURIComponent(toEtapa)), { mode: 'no-cors' }).catch(() => { });
                }
                return;
            }
            if (!order._fromSheets) return;
            const item = String(order.grupoId || '').trim();
            if (!item) return;
            const tipo = order.tipo || 'normal';
            const esImpresion = tipo === 'int_sub' || tipo === 'port_sub';
            const hoja = esImpresion ? 'impresion' : 'acabados';
            const po = tipo === 'int_sub' ? 'int' : tipo === 'port_sub' ? 'port' : '';

            // Sale de Impresión hacia Acabados → mover fila de Impresion org a Acabado org
            if (fromEtapa === 'impresion' && isAcabEtapa(toEtapa)) {
                fetch(scriptURL('action=moverAacabados&item=' + encodeURIComponent(item) + (po ? '&po=' + po : '')), { mode: 'no-cors' }).catch(() => { });
                // Pre-registrar posición para la orden union_result que aparecerá en el próximo sync
                etapaMap[item + '-A'] = toEtapa;
                return;
            }
            // Llega a Empaque → mover fila de Acabado org a Empacado
            if (toEtapa === 'empaque') {
                fetch(scriptURL('action=moverAempacado&item=' + encodeURIComponent(item)), { mode: 'no-cors' }).catch(() => { });
                return;
            }
            // Llega a Listo → eliminar de Acabado org / Empacado
            if (toEtapa === 'listo') {
                fetch(scriptURL('action=marcarListo&item=' + encodeURIComponent(item) + '&hoja=' + hoja + (po ? '&po=' + po : '')), { mode: 'no-cors' }).catch(() => { });
                return;
            }
            // Movimiento dentro de Acabados → actualizar etapa_actual en Acabado org
            if (isAcabEtapa(toEtapa)) {
                fetch(scriptURL('action=updateEtapa&item=' + encodeURIComponent(item) + '&etapa=' + encodeURIComponent(toEtapa)), { mode: 'no-cors' }).catch(() => { });
            }
        }
        function markListoInSheets(order, fromEtapa) { callScript(order, 'listo', fromEtapa); }

        async function runAccionSheets(action, label) {
            if (!cfg.scriptUrl) { showToast('⚠️ Configura URL del script primero'); return; }
            const log = document.getElementById('accion-log');
            if (log) log.textContent = '⏳ ' + label + '...';
            try {
                await fetch(scriptURL('action=' + action), { mode: 'no-cors' });
                if (log) log.innerHTML = '<span style="color:#4ade80">✅ ' + label + ' — listo. Sincroniza para ver los cambios.</span>';
                showToast('✅ ' + label);
            } catch {
                if (log) log.innerHTML = '<span style="color:#ef4444">❌ Error al conectar con el script</span>';
            }
        }
        function runMoverListos() { runAccionSheets('moverlistos', 'Moviendo listo=TRUE a Acabados'); }
        function runMigrarMuestras() { runAccionSheets('migrarmuestras', 'Rescatando muestras de M Acab'); }
        function runBorrarListos() {
          if (!cfg.scriptUrl) { showToast('⚠️ Configura URL del script primero'); return; }
          if (!confirm('¿Borrar permanentemente todas las filas con listo=TRUE de Impresion org y Acabado org? Esto no se puede deshacer.')) return;
          runAccionSheets('borrarlistos', 'Borrando filas listo=TRUE de Impresion org y Acabado org');
        }
        function runLimpiezaCompleta() {
          if (!cfg.scriptUrl) { showToast('⚠️ Configura URL del script primero'); return; }
          runAccionSheets('limpiezacompleta', 'Ejecutando limpieza completa (Imp→Acab, Acab→Emp, Muestras→Emp)');
        }

        async function testScriptUrl() {
            if (!cfg.scriptUrl) { showToast('⚠️ Ingresa la URL del Script primero'); return; }
            showToast('🔄 Probando URL del script...');
            try {
                const r = await fetch(scriptURL('test=1'));
                const txt = await r.text();
                showToast('✅ Script responde: ' + txt.substring(0, 60));
            } catch {
                showToast('❌ No se pudo conectar al script (verifica que esté publicado como "Cualquiera")');
            }
        }

        // Toast de notificación rápida
        function showToast(msg, ms) {
            let t = document.getElementById('toast');
            if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:999;transition:opacity .3s;pointer-events:none;max-width:90vw;word-break:break-all'; document.body.appendChild(t); }
            t.textContent = msg; t.style.opacity = '1';
            clearTimeout(t._to); t._to = setTimeout(() => { t.style.opacity = '0'; }, ms || 3000);
        }

        // Función principal de sincronización
        async function runSync() {
            if (_syncing) return;
            _syncing = true;
            const _snap = [...orders];
            const btn = document.getElementById('sync-btn');
            const log = document.getElementById('sync-log');
            if (btn) btn.disabled = true;
            if (log) log.textContent = '⏳ Conectando con Google Sheets...';

            try {
                if (!cfg.scriptUrl) {
                    if (log) log.innerHTML = '<span style="color:#ef4444">❌ Configura la URL del Apps Script primero (⚙️ Configuración).</span>';
                    if (btn) btn.disabled = false;
                    _syncing = false;
                    return;
                }
                // Lee cada hoja directo desde tu propio Apps Script (acción "exportsheet") —
                // ya no depende de que las hojas estén publicadas al público ni de proxies CORS externos.
                async function fetchCSV(hoja) {
                    try {
                        const r = await fetch(scriptURL('action=exportsheet&hoja=' + hoja), { cache: 'no-cache' });
                        if (!r || !r.ok) return null;
                        const text = await r.text();
                        // El script devuelve JSON (no CSV) cuando está ocupado con la limpieza
                        // automática (candado compartido) — tratarlo como fallo de esta categoría.
                        if (text.trim().startsWith('{')) return null;
                        return { ok: true, text: () => Promise.resolve(text) };
                    } catch { }
                    return null;
                }
                const [respImp, respAcab, respMuestras] = await Promise.all([
                    fetchCSV('impresion'),
                    fetchCSV('acabados'),
                    fetchCSV('muestras'),
                ]);

                let newOrders = [];
                let countImp = 0, countAcab = 0, countMuestras = 0;
                // Si una categoría falla, se conserva lo que ya había de ESA categoría en vez de
                // vaciarla — antes, un fallo pasajero en una sola de las 3 peticiones hacía que
                // esa categoría entera "desapareciera" del tablero hasta el siguiente sync.
                const warnings = [];

                // Impresion org — fuente principal
                let _debugImp = [];
                if (respImp && respImp.ok) {
                    const text = await respImp.text();
                    const rows = parseCSV(text);
                    rows.forEach(row => {
                        const o = mapImpRow(row);
                        if (o) { newOrders.push(o); _debugImp.push({ id: o.id, tabs: o.tabloidesSrc }); }
                    });
                    countImp = newOrders.length;
                } else {
                    const preserved = _snap.filter(o => o._fromSheets && (o.tipo === 'int_sub' || o.tipo === 'port_sub'));
                    newOrders.push(...preserved);
                    countImp = preserved.length;
                    if (preserved.length) warnings.push(`⚠️ No se pudo leer Impresión — se conservaron ${preserved.length} órdenes de la última sincronización exitosa`);
                }

                // Acabado org — solo agrega órdenes cuyo grupoId NO está ya en Impresion org ni en Firebase
                if (respAcab && respAcab.ok) {
                    const text = await respAcab.text();
                    const rows = parseCSV(text);
                    // grupoIds ya cubiertos: solo los de Impresion org (no usar orders viejos)
                    const gruposCubiertos = new Set([
                        ...newOrders.map(o => o.grupoId).filter(Boolean),
                    ]);
                    let acabAdded = 0;
                    rows.forEach(row => {
                        const o = mapAcabRow(row);
                        if (o && !gruposCubiertos.has(o.grupoId)) {
                            newOrders.push(o);
                            gruposCubiertos.add(o.grupoId);
                            acabAdded++;
                        }
                    });
                    countAcab = acabAdded;
                } else {
                    const gruposCubiertos = new Set(newOrders.map(o => o.grupoId).filter(Boolean));
                    const preserved = _snap.filter(o => o._fromSheets && o.tipo === 'union_result' && !gruposCubiertos.has(o.grupoId));
                    newOrders.push(...preserved);
                    countAcab = preserved.length;
                    if (preserved.length) warnings.push(`⚠️ No se pudo leer Acabados — se conservaron ${preserved.length} órdenes de la última sincronización exitosa`);
                }

                // Muestras — se añaden siempre como entradas independientes (id sufijo -M)
                let _debugMuestras = { status: 'no conectó', totalRows: 0, cargadas: 0, saltadas: 0, cols: [] };
                if (respMuestras && respMuestras.ok) {
                    const text = await respMuestras.text();
                    const rows = parseCSV(text);
                    _debugMuestras.status = 'conectó';
                    _debugMuestras.totalRows = rows.length;
                    if (rows.length > 0) _debugMuestras.cols = Object.keys(rows[0]);
                    const prevLen = newOrders.length;
                    rows.forEach(row => {
                        const o = mapMuestraRow(row);
                        if (o) newOrders.push(o);
                        else _debugMuestras.saltadas++;
                    });
                    countMuestras = newOrders.length - prevLen;
                    _debugMuestras.cargadas = countMuestras;
                } else {
                    if (respMuestras) _debugMuestras.status = 'error HTTP ' + respMuestras.status;
                    const preserved = _snap.filter(o => o._fromSheets && o._isMuestra);
                    newOrders.push(...preserved);
                    countMuestras = preserved.length;
                    if (preserved.length) warnings.push(`⚠️ No se pudo leer Muestras — se conservaron ${preserved.length} de la última sincronización exitosa`);
                }

                // Deduplicar por id exacto (INT y PORT del mismo trabajo tienen distinto id)
                const _seenIds = new Set();
                newOrders = newOrders.filter(o => {
                    if (_seenIds.has(o.id)) return false;
                    _seenIds.add(o.id);
                    return true;
                });

                if (!respImp && !respAcab && !respMuestras) {
                    if (log) log.innerHTML = '<span style="color:#ef4444">❌ No se pudo conectar a ninguna hoja. Verifica la red o que las hojas estén publicadas como CSV.</span>';
                    if (btn) btn.disabled = false;
                    return;
                }

                // ── SHEETS COMO FUENTE DE VERDAD ────────────────────────────
                // Las órdenes se reconstruyen completamente desde los sheets.
                // Se conservan solo las órdenes manuales (no vienen de sheets).
                // ────────────────────────────────────────────────────────────
                const manual = _snap.filter(o => !o._fromSheets);
                const countNuevas = newOrders.length;
                const countActualizadas = 0, countSinCambio = 0;

                // Ocultar INT/PORT de sheets si ya existe un union_result manual activo para ese grupo
                // (órdenes fusionadas antes de v8.68 — no crea nuevas fusiones)
                const _legacyUnions = new Set(
                    manual.filter(o => o.tipo === 'union_result' && o.grupoId && !o._merged && o.etapa !== 'listo')
                        .map(o => o.grupoId)
                );

                // Aplicar posiciones guardadas en Firebase (etapaMap) sobre lo que dicen los sheets
                orders = [...manual, ...newOrders.map(o => {
                    const local = _snap.find(x => x.id === o.id);
                    let result = o;
                    if (_legacyUnions.has(o.grupoId) && (o.tipo === 'int_sub' || o.tipo === 'port_sub')) {
                        result = { ...o, _merged: true, etapa: 'listo' };
                    } else if (o.etapa === 'listo' && etapaMap[o.id]) {
                        delete etapaMap[o.id]; result = o;
                    } else if (etapaMap[o.id] && o.etapa !== 'listo' && !o._listoInSheets) {
                        // No sobreescribir si Sheets ya marcó la orden como listo (avanzó de fase)
                        result = { ...o, etapa: etapaMap[o.id] };
                    } else if (local && etapaRank(local) > etapaRank(o)) {
                        // No regresar una orden que localmente ya iba más avanzada (ej. recién marcada
                        // Listo) solo porque Sheets todavía no se puso al día — la limpieza automática
                        // de filas corre cada 15 min y el sync cada 5, así que hay una ventana donde
                        // Sheets "atrasado" podía deshacer el avance que ya se hizo en la app.
                        result = { ...o, etapa: local.etapa, _merged: local._merged || o._merged };
                    }
                    // etaPredicha es una foto fija tomada la primera vez que vimos la orden —
                    // una vez que existe, se conserva tal cual en cada sync futuro.
                    if (local && local.etaPredicha) result = { ...result, etaPredicha: local.etaPredicha };
                    return result;
                })];
                // Congelar la primera predicción del motor para cada orden nueva/activa que
                // todavía no tenga una — sirve después para medir qué tan preciso fue el motor
                // comparando esta fecha contra cuándo se entregó de verdad (ver Stats).
                const _sinPrediccion = orders.filter(o => !o.etaPredicha && o.etapa !== 'listo' && !o._merged);
                if (_sinPrediccion.length) {
                    const _fm = scheduleMachines(orders, cfg).finishMin;
                    orders = orders.map(o => {
                        if (o.etaPredicha || o.etapa === 'listo' || o._merged || _fm[o.id] == null) return o;
                        return { ...o, etaPredicha: calcETA(o, _fm).toISOString().split('T')[0] };
                    });
                }
                await saveBoard();

                const ahora = new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
                if (log) log.innerHTML = `
          <span style="color:#4ade80;font-weight:700">✅ Sincronizado a las ${ahora}</span><br>
          ${warnings.length ? `<div style="margin-top:8px;background:#2d1a0a;border:1px solid #92400e;border-radius:8px;padding:8px 10px;font-size:12px;color:#fbbf24">${warnings.map(w => e(w)).join('<br>')}</div>` : ''}
          <div style="margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px">
            <span style="background:#0a2e1a;border:1px solid #166534;padding:4px 10px;border-radius:6px;color:#4ade80">🆕 ${countNuevas} nuevas</span>
            <span style="background:#0a1f3a;border:1px solid #1d4ed8;padding:4px 10px;border-radius:6px;color:#60a5fa">🔄 ${countActualizadas} actualizadas</span>
            <span style="background:#0f172a;border:1px solid #334155;padding:4px 10px;border-radius:6px;color:#64748b">✓ ${countSinCambio} sin cambio</span>
          </div>
          <div style="margin-top:6px;font-size:11px;color:#475569">Total en sistema: ${orders.length} · De sheets: ${newOrders.length} (🔬 ${countMuestras} muestras)</div>
          <details style="margin-top:10px"><summary style="font-size:11px;color:${_debugMuestras.cargadas > 0 ? '#4ade80' : '#f87171'};cursor:pointer;font-weight:700">🔬 Debug Muestras — ${_debugMuestras.status} · ${_debugMuestras.totalRows} filas · ${_debugMuestras.cargadas} cargadas · ${_debugMuestras.saltadas} saltadas</summary>
          <div style="margin-top:6px;background:#0f172a;border-radius:6px;padding:8px;font-size:11px;font-family:monospace;color:#94a3b8">
            <div><b style="color:#60a5fa">Columnas detectadas:</b> ${_debugMuestras.cols.length ? _debugMuestras.cols.join(', ') : '— ninguna —'}</div>
            <div style="margin-top:4px;font-size:10px;color:#475569">Columnas esperadas: <b>nombre</b> (o name/titulo), <b># item</b> (o item), <b>eliminar</b> (o procesado/listo), entrega, cantidad, etapa_actual</div>
          </div></details>
          <details style="margin-top:6px"><summary style="font-size:11px;color:#64748b;cursor:pointer">🔍 Ver tabloides leídos de Impresión</summary>
          <div style="margin-top:6px;max-height:180px;overflow-y:auto;background:#0f172a;border-radius:6px;padding:8px;font-size:11px;font-family:monospace">
          ${_debugImp.map(d => `<div style="color:${d.tabs === 0 ? '#ef4444' : '#94a3b8'}">${e(d.id)} → <b style="color:${d.tabs === 0 ? '#ef4444' : '#4ade80'}">${d.tabs} tab</b>${d.tabs === 0 ? ' ⚠️ NO ENCONTRÓ COLUMNA' : ''}${d.tabs > 0 && d.tabs < 100 ? ' ⚠️ NÚMERO SOSPECHOSO' : ''}</div>`).join('')}
          </div></details>`;
                setTimeout(() => { showSync = false; render(); }, 3000);

            } catch (err) {
                if (log) log.innerHTML = `<span style="color:#ef4444">❌ Error al conectar: ${err.message}</span><br><br>` +
                    `<span style="color:#94a3b8;font-size:12px">Si el archivo está abierto localmente (file://), el navegador bloquea las peticiones a Google Sheets. ` +
                    `Sube el archivo a un servidor o úsalo en Claude.ai.</span>`;
                if (btn) btn.disabled = false;
            } finally {
                _syncing = false;
            }
        }

        function syncHTML() {
            return `<div class="overlay" onclick="if(event.target===this)closeSync()">
    <div class="modal" style="max-width:500px" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 style="font-size:17px;font-weight:700">🔄 Sincronizar con Google Sheets</h2>
        <button class="bico" onclick="closeSync()" style="font-size:20px;color:#94a3b8">✕</button>
      </div>
      <div style="background:#0f172a;border-radius:10px;padding:14px;margin-bottom:16px;font-size:13px">
        <div style="color:#60a5fa;font-weight:700;margin-bottom:8px">📋 Hojas leídas (vía tu Apps Script, con token):</div>
        <div style="color:#94a3b8;margin-bottom:4px">🖨️ <b style="color:#fb923c">Impresión</b> — hoja "Impresion org"</div>
        <div style="color:#94a3b8;margin-bottom:4px">✂️ <b style="color:#c084fc">Acabados</b> — hoja "Acabado org"</div>
        <div style="color:#94a3b8">🔬 <b style="color:#86efac">Muestras</b> — hoja "M Imp"</div>
        <div style="color:#475569;font-size:11px;margin-top:8px">Ya no dependen de que las hojas estén "publicadas al público" — se leen directo con tu Apps Script (acción "exportsheet"), protegidas por tu token.</div>
      </div>
      <div style="background:#0a1f0a;border-radius:10px;padding:12px;margin-bottom:16px;font-size:12px;color:#64748b">
        <b style="color:#4ade80">Cómo funciona:</b><br>
        • Órdenes en Impresión con <b>Listo=FALSE</b> → etapa "Impresión"<br>
        • Órdenes en Impresión con <b>Listo=TRUE</b> → etapa "Acabados"<br>
        • Órdenes en Acabados con <b>Listo=FALSE</b> → etapa "Acabados"<br>
        • INT + PORT del mismo número → se unen automáticamente<br>
        • Los <b>tiempos los calcula nuestro sistema</b> con las velocidades configuradas
      </div>
      <div style="background:#0a0f1e;border-radius:10px;padding:12px;margin-bottom:14px">
        <div style="font-size:12px;color:#f59e0b;font-weight:700;margin-bottom:8px">⚡ Para activar "marcar Listo automático" al mover órdenes:</div>
        <div style="font-size:11px;color:#64748b;line-height:1.7">
          1. Abre tu Google Sheet → <b style="color:#94a3b8">Extensiones → Apps Script</b><br>
          2. Borra todo el código y pega el script que está abajo<br>
          3. <b style="color:#ef4444">Cambia la constante TOKEN</b> (primera línea de doGet) por una clave larga y única, solo tuya<br>
          4. <b style="color:#94a3b8">Implementar → Nueva implementación → App web</b><br>
          5. "Ejecutar como": <b style="color:#94a3b8">Yo</b> · "Quién tiene acceso": <b style="color:#94a3b8">Cualquier usuario</b><br>
          6. Copia la URL y pégala en <b style="color:#94a3b8">⚙️ Configuración → URL Apps Script</b><br>
          7. Pega esa <b style="color:#ef4444">misma clave</b> en <b style="color:#94a3b8">⚙️ Configuración → 🔒 Token secreto del script</b><br>
          <span style="color:#f87171">⚠️ Si ya tenías un script publicado sin token, todas las acciones fallarán con "token invalido" hasta que actualices ambos lados.</span>
        </div>
        <div style="margin-top:10px;background:#020617;border-radius:6px;padding:10px;font-size:11px;color:#4ade80;font-family:monospace;white-space:pre-wrap;max-height:220px;overflow-y:auto">function doGet(e){
  try{
    // Cambia esto por una clave larga y única, y pega la MISMA clave en
    // ⚙️ Configuración → 🔒 Token secreto del script. Sin esto, cualquiera
    // con esta URL podría borrar o modificar tus hojas.
    const TOKEN='CAMBIA_ESTO_POR_TU_CLAVE_SECRETA';
    if((e.parameter.token||'')!==TOKEN)return r('ERROR:token invalido');
    const ss=SpreadsheetApp.getActiveSpreadsheet();
    const action=(e.parameter.action||'marcarListo').toLowerCase();
    const item=(e.parameter.item||'').toString().trim();
    const hoja=(e.parameter.hoja||'').toLowerCase();
    const po=(e.parameter.po||'').toLowerCase();
    const etapa=(e.parameter.etapa||'').toString().trim();
    const trackingId=(e.parameter.trackingId||'').toString().trim();
    const accionRes=doGet_acciones(ss,action);
    if(accionRes)return accionRes;
    if(!item)return r('ERROR:falta item');

    // updateTracking — actualiza Status + "Fecha queue" en spreadsheet externo
    if(action==='updatetracking'&&trackingId){
      try{
        const tss=SpreadsheetApp.openById(trackingId);
        const tsh=tss.getSheets()[0];
        const tdata=tsh.getDataRange().getValues();
        const theads=tdata[0].map(h=>h.toString().toLowerCase().trim());
        const tci=theads.findIndex(h=>['# item','item','#item','orden #','orden','order #','order'].includes(h));
        const tcs=theads.findIndex(h=>h==='status');
        const tcf=theads.findIndex(h=>h==='fecha queue');
        if(tci<0)return r('ERROR:tracking no tiene columna item');
        if(tcs<0&&tcf<0)return r('ERROR:tracking no tiene columna Status ni "Fecha queue"');
        const now=new Date();
        const fmt=Utilities.formatDate(now,Session.getScriptTimeZone(),'dd/MM/yyyy HH:mm:ss');
        const item5=item.toString().slice(0,5);
        let n=0;
        for(let i=1;i<tdata.length;i++){
          const rItem=tdata[i][tci]?.toString().trim().slice(0,5);
          if(rItem!==item5)continue;
          const curStatus=tcs>=0?tdata[i][tcs]?.toString().trim():'';
          if(curStatus==='Posted')continue;
          if(tcs>=0&&etapa)tsh.getRange(i+1,tcs+1).setValue(etapa);
          if(tcf>=0)tsh.getRange(i+1,tcf+1).setValue(fmt);
          n++;
        }
        return r('OK:tracking '+n+' filas actualizadas');
      }catch(ex){return r('ERROR:tracking:'+ex.message);}
    }

    // marcarProcesado — busca en M Acab primero, luego M imp
    if(action==='marcarprocesado'){
      let sh=ss.getSheets().find(s=>s.getName().trim()==='M Acab');
      let data=sh?sh.getDataRange().getValues():null;
      let heads=data?data[0].map(h=>h.toString().toLowerCase().trim()):null;
      let ci=heads?heads.findIndex(h=>['# item','item','#item'].includes(h)):-1;
      const inAcab=data&&ci>=0&&data.slice(1).some(row=>row[ci]?.toString().trim()===item);
      if(!inAcab){
        sh=ss.getSheets().find(s=>s.getName().trim()==='M imp');
        if(!sh)return r('ERROR:hoja M imp no encontrada');
        data=sh.getDataRange().getValues();
        heads=data[0].map(h=>h.toString().toLowerCase().trim());
        ci=heads.findIndex(h=>['# item','item','#item'].includes(h));
      }
      const cp2=heads.findIndex(h=>['eliminar','procesado','listo','done','ready'].includes(h));
      if(ci<0)return r('ERROR:no columna "# item"');
      if(cp2<0)return r('ERROR:no columna "eliminar"');
      let n=0;
      for(let i=1;i<data.length;i++){
        if(data[i][ci]?.toString().trim()===item){sh.getRange(i+1,cp2+1).setValue(true);n++;}
      }
      return r('OK:'+n+' muestras marcadas como Eliminar');
    }

    // moverMuestraAcab — mueve de M imp a M Acab al llegar a acabados
    if(action==='movermuestraacab'){
      const src=ss.getSheets().find(s=>s.getName().trim()==='M imp');
      const dst=ss.getSheets().find(s=>s.getName().trim()==='M Acab');
      if(!src)return r('ERROR:hoja "M imp" no encontrada');
      if(!dst)return r('ERROR:hoja "M Acab" no encontrada');
      const d=src.getDataRange().getValues();
      const h=d[0].map(v=>v.toString().toLowerCase().trim());
      const ci=h.findIndex(v=>['# item','item','#item'].includes(v));
      const ce=h.findIndex(v=>['etapa_actual','etapa actual','etapa'].includes(v));
      if(ci<0)return r('ERROR:no columna "# item"');
      let n=0;
      for(let i=d.length-1;i>=1;i--){
        if(d[i][ci]?.toString().trim()!==item)continue;
        const row=[...d[i]];
        if(ce>=0)row[ce]=etapa;
        dst.appendRow(row);
        src.deleteRow(i+1);
        n++;
      }
      return r('OK:'+n+' muestras movidas a M Acab');
    }

    // moverAempacado — para muestras busca en M Acab primero, luego M imp
    if(action==='moveraempacado'){
      let srcNombre,empNombre;
      if(hoja==='muestras'){
        const shA=ss.getSheets().find(s=>s.getName().trim()==='M Acab');
        const dA=shA?shA.getDataRange().getValues():null;
        const hA=dA?dA[0].map(v=>v.toString().toLowerCase().trim()):null;
        const ciA=hA?hA.findIndex(v=>['# item','item','#item'].includes(v)):-1;
        const inAcab=dA&&ciA>=0&&dA.slice(1).some(row=>row[ciA]?.toString().trim()===item);
        srcNombre=inAcab?'M Acab':'M imp';
        empNombre='M emp';
      }else{
        srcNombre='Acabado org';
        empNombre='Empacado';
      }
      const src=ss.getSheets().find(s=>s.getName().trim()===srcNombre);
      if(!src)return r('ERROR:hoja "'+srcNombre+'" no encontrada');
      const emp=ss.getSheets().find(s=>s.getName().trim()===empNombre);
      const d2=src.getDataRange().getValues();
      const h2=d2[0].map(h=>h.toString().toLowerCase().trim());
      const ci2=h2.findIndex(h=>['# item','item','#item'].includes(h));
      const ce=h2.findIndex(h=>['etapa_actual','etapa actual','etapa'].includes(h));
      if(ci2<0)return r('ERROR:no columna "# item"');
      let n=0;
      for(let i=d2.length-1;i>=1;i--){
        if(d2[i][ci2]?.toString().trim()!==item)continue;
        if(emp){emp.appendRow(d2[i]);src.deleteRow(i+1);}
        else if(ce>=0){src.getRange(i+1,ce+1).setValue('empaque');}
        n++;
      }
      return r('OK:'+n+' filas movidas a '+empNombre);
    }

    // updateEtapa en M Acab — si no está ahí, busca en M imp y la mueve (migración automática)
    if(action==='updateetapa'&&hoja==='macab'){
      const shAcab=ss.getSheets().find(s=>s.getName().trim()==='M Acab');
      const dAcab=shAcab?shAcab.getDataRange().getValues():null;
      const hAcab=dAcab?dAcab[0].map(h=>h.toString().toLowerCase().trim()):null;
      const ciAcab=hAcab?hAcab.findIndex(h=>['# item','item','#item'].includes(h)):-1;
      const inAcab=dAcab&&ciAcab>=0&&dAcab.slice(1).some(row=>row[ciAcab]?.toString().trim()===item);
      if(!inAcab){
        // No está en M Acab — migrar desde M imp
        const src=ss.getSheets().find(s=>s.getName().trim()==='M imp');
        const dst=shAcab;
        if(!src)return r('ERROR:hoja M imp no encontrada');
        if(!dst)return r('ERROR:hoja M Acab no encontrada');
        const d=src.getDataRange().getValues();
        const h=d[0].map(v=>v.toString().toLowerCase().trim());
        const ciSrc=h.findIndex(v=>['# item','item','#item'].includes(v));
        const ce=h.findIndex(v=>['etapa_actual','etapa actual','etapa'].includes(v));
        if(ciSrc<0)return r('ERROR:no columna # item en M imp');
        let n=0;
        for(let i=d.length-1;i>=1;i--){
          if(d[i][ciSrc]?.toString().trim()!==item)continue;
          const row=[...d[i]];
          if(ce>=0)row[ce]=etapa;
          dst.appendRow(row);
          src.deleteRow(i+1);
          n++;
        }
        return r('OK:migrada de M imp a M Acab '+n+' filas');
      }
      const ce=hAcab.findIndex(h=>['etapa_actual','etapa actual','etapa'].includes(h));
      if(ce<0)return r('ERROR:no columna etapa_actual en M Acab');
      let n=0;
      for(let i=1;i<dAcab.length;i++){
        if(dAcab[i][ciAcab]?.toString().trim()!==item)continue;
        shAcab.getRange(i+1,ce+1).setValue(etapa);
        n++;
      }
      return r('OK:'+n+' filas actualizadas en M Acab');
    }

    // handler genérico: marcarListo, updateEtapa (impresion/muestras/acabados), moverAacabados
    const nombreHoja=hoja==='impresion'?'Impresion org':hoja==='muestras'?'M imp':'Acabado org';
    const sh=ss.getSheets().find(s=>s.getName().trim()===nombreHoja);
    if(!sh)return r('ERROR:hoja "'+nombreHoja+'" no encontrada');
    const data=sh.getDataRange().getValues();
    const heads=data[0].map(h=>h.toString().toLowerCase().trim());
    const ci=heads.findIndex(h=>['# item','item','#item'].includes(h));
    const cl=heads.findIndex(h=>['listo','done','ready','procesado'].includes(h));
    const cpO=heads.findIndex(h=>['p_o','po','tipo'].includes(h));
    const cetapa=heads.findIndex(h=>['etapa_actual','etapa actual','etapa'].includes(h));
    if(ci<0)return r('ERROR:no encontré columna "# item"');
    if(cl<0)return r('ERROR:no encontré columna "listo/procesado"');
    let n=0;
    for(let i=1;i<data.length;i++){
      const rItem=data[i][ci]?.toString().trim();
      const rPO=cpO>=0?data[i][cpO]?.toString().toLowerCase():'';
      if(rItem!==item)continue;
      if(po&&rPO&&!rPO.includes(po))continue;
      if(action==='updateetapa'&&cetapa>=0&&etapa){sh.getRange(i+1,cetapa+1).setValue(etapa);}
      else{sh.getRange(i+1,cl+1).setValue(true);}
      n++;
    }
    return r('OK:'+n+' filas actualizadas');
  }catch(ex){return r('ERROR:'+ex.message);}
}

// moverlistos — mueve todas las filas con listo=TRUE de Impresion org → Acabado org
function moverListos(ss){
  const src=ss.getSheets().find(s=>s.getName().trim()==='Impresion org');
  const dst=ss.getSheets().find(s=>s.getName().trim()==='Acabado org');
  if(!src||!dst)return'ERROR:hojas no encontradas';
  const data=src.getDataRange().getValues();
  const heads=data[0].map(h=>h.toString().toLowerCase().trim());
  const ciL=heads.findIndex(h=>['listo','done','ready'].includes(h));
  if(ciL<0)return'ERROR:no columna listo';
  let n=0;
  for(let i=data.length-1;i>=1;i--){
    if(data[i][ciL]?.toString().toLowerCase()!=='true')continue;
    dst.appendRow(data[i]);src.deleteRow(i+1);n++;
  }
  return'OK:'+n+' filas movidas';
}

// borrarlistos — elimina filas con listo=TRUE de Impresion org y de Acabado org
function borrarListos(ss){
  let n=0;
  const hojas=['Impresion org','Acabado org'];
  for(const nombre of hojas){
    const sh=ss.getSheets().find(s=>s.getName().trim()===nombre);
    if(!sh)continue;
    const data=sh.getDataRange().getValues();
    const heads=data[0].map(h=>h.toString().toLowerCase().trim());
    const ciL=heads.findIndex(h=>['listo','done','ready'].includes(h));
    if(ciL<0)continue;
    for(let i=data.length-1;i>=1;i--){
      if(data[i][ciL]?.toString().toLowerCase()!=='true')continue;
      sh.deleteRow(i+1);n++;
    }
  }
  return'OK:'+n+' filas eliminadas';
}

// migrarmuestras — mueve muestras de M Acab → M imp (recupera las que desaparecieron)
function migrarMuestras(ss){
  const src=ss.getSheets().find(s=>s.getName().trim()==='M Acab');
  const dst=ss.getSheets().find(s=>s.getName().trim()==='M imp');
  if(!src)return'OK:M Acab no existe o ya está vacía';
  if(!dst)return'ERROR:M imp no encontrada';
  const d=src.getDataRange().getValues();
  const h=d[0].map(v=>v.toString().toLowerCase().trim());
  const ciE=h.findIndex(v=>['eliminar','procesado','terminado','listo','done'].includes(v));
  let n=0;
  for(let i=d.length-1;i>=1;i--){
    if(ciE>=0&&d[i][ciE]?.toString().toLowerCase()==='true')continue;
    dst.appendRow(d[i]);src.deleteRow(i+1);n++;
  }
  return'OK:'+n+' muestras migradas';
}

// ── Helpers ──────────────────────────────────────────────────────────
function findCol(h,...n){return h.findIndex(x=>n.map(v=>v.toLowerCase()).includes(x.toLowerCase().trim()));}
function fmtDate(d){if(!d)return'';try{return Utilities.formatDate(new Date(d),Session.getScriptTimeZone(),'dd/MM/yyyy HH:mm:ss');}catch(e){return'';}}
function calcTiempo(d1,d2){try{const ms=new Date(d2)-new Date(d1);if(ms<0||!d1)return'';return Math.floor(ms/3600000)+'h '+Math.floor((ms%3600000)/60000)+'m';}catch(e){return'';}}

// ── Impresion org listo=TRUE → Acabado org + log ──────────────────────
function limpiezaImpresion(ss){
  const src=ss.getSheets().find(s=>s.getName().trim()==='Impresion org');
  const dst=ss.getSheets().find(s=>s.getName().trim()==='Acabado org');
  const log=ss.getSheets().find(s=>s.getName().trim()==='Log eliminados - Impresion org');
  if(!src||!dst)return 0;
  const data=src.getDataRange().getValues();if(data.length<=1)return 0;
  const h=data[0].map(x=>x.toString().toLowerCase().trim());
  const ciL=findCol(h,'listo','done','ready');if(ciL<0)return 0;
  const ciI=findCol(h,'# item','#item','item');
  const ciN=findCol(h,'nombre','name','titulo');
  const ciH=findCol(h,'hoy','fecha subida','fecha entrada','fecha');
  const now=new Date();let n=0;
  for(let i=data.length-1;i>=1;i--){
    if(data[i][ciL]?.toString().toLowerCase()!=='true')continue;
    const item=ciI>=0?data[i][ciI]?.toString().trim():'';
    const nombre=ciN>=0?data[i][ciN]?.toString().trim():'';
    const sub=ciH>=0?data[i][ciH]:null;
    if(log)log.appendRow([item,nombre,sub?fmtDate(sub):'',fmtDate(now),calcTiempo(sub,now)]);
    dst.appendRow(data[i]);src.deleteRow(i+1);n++;
  }
  return n;
}

// ── M imp Eliminar=TRUE → Empacado + log ─────────────────────────────
function limpiezaMuestras(ss){
  const src=ss.getSheets().find(s=>s.getName().trim()==='M imp');
  const dst=ss.getSheets().find(s=>s.getName().trim()==='Empacado');
  const log=ss.getSheets().find(s=>s.getName().trim()==='Log eliminados - M Imp');
  if(!src)return 0;
  const data=src.getDataRange().getValues();if(data.length<=1)return 0;
  const h=data[0].map(x=>x.toString().toLowerCase().trim());
  const ciE=findCol(h,'eliminar','procesado','terminado','done');if(ciE<0)return 0;
  const now=new Date();
  const LC=['fecha ingreso','entrega','# item','# order','group name','description','type','status','terminado','email','id dm','acabados','papel','hojas','up (pz tab)','procesado','eliminar','urgencia','p_o','color_bn','maquina'];
  let n=0;
  for(let i=data.length-1;i>=1;i--){
    if(data[i][ciE]?.toString().toLowerCase()!=='true')continue;
    if(log)log.appendRow([...LC.map(c=>{const ci=findCol(h,c);return ci>=0?data[i][ci]:'';}),fmtDate(now)]);
    if(dst)dst.appendRow(data[i]);
    src.deleteRow(i+1);n++;
  }
  return n;
}

// ── limpiezaCompleta — para el trigger automático cada 20 min ─────────
function limpiezaCompleta(){
  const lock=LockService.getScriptLock();
  if(!lock.tryLock(10000)){Logger.log('En uso por otra instancia');return;}
  try{
    const ss=SpreadsheetApp.getActiveSpreadsheet();
    Logger.log('Limpieza: imp='+limpiezaImpresion(ss)+' acab='+limpiezaAcabados(ss)+' muestras='+limpiezaMuestras(ss));
  }catch(e){Logger.log('Error: '+e.message);}finally{lock.releaseLock();}
}

// ── Ejecutar UNA VEZ desde el editor de Apps Script para activar el trigger ──
function configurarTrigger(){
  ScriptApp.getProjectTriggers().filter(t=>t.getHandlerFunction()==='limpiezaCompleta').forEach(t=>ScriptApp.deleteTrigger(t));
  ScriptApp.newTrigger('limpiezaCompleta').timeBased().everyMinutes(20).create();
  Logger.log('✅ Trigger activo: limpiezaCompleta cada 20 minutos');
}
